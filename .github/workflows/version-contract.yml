name: Ghosium Version and Release Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify product version synchronization and progression
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'0\.\d+\.\d+', version):
              raise SystemExit(f'Invalid Ghosium product VERSION: {version!r}')

          manifest = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != version or manifest.get('manifest_version') != 3:
              raise SystemExit('Bundled Ghosium Privacy manifest/version contract is invalid.')

          catalog = json.loads(Path('store-web/storage/data/extensions.json').read_text(encoding='utf-8'))
          for item in catalog.get('extensions', []):
              if item.get('status') == 'built_in' and item.get('version') != version:
                  raise SystemExit(f'Built-in Store metadata mismatch: {item.get("id")}')

          if os.environ.get('EVENT_NAME') == 'pull_request':
              base_ref = os.environ.get('BASE_REF') or 'main'
              head_ref = os.environ.get('HEAD_REF') or ''
              base_version = subprocess.check_output(
                  ['git', 'show', f'origin/{base_ref}:VERSION'], text=True
              ).strip()

              if version == base_version:
                  marker = Path(f'.release/ghosium-v{version}.request')
                  changed = [line.strip() for line in subprocess.check_output(
                      ['git', 'diff', '--name-only', f'origin/{base_ref}...HEAD'], text=True
                  ).splitlines() if line.strip()]
                  marker_only = (
                      head_ref == f'ghosium/release/{version}'
                      and changed == [marker.as_posix()]
                      and marker.is_file()
                      and marker.read_text(encoding='utf-8').strip() == f'ghosium-v{version}'
                  )
                  if not marker_only:
                      raise SystemExit(
                          'Every merged production change requires a new Ghosium VERSION; '
                          'the only same-version exception is an exact release-marker-only PR '
                          'from ghosium/release/<VERSION>.'
                      )
                  print('candidate evidence is enforced by the release marker promotion contract')
              else:
                  current = tuple(map(int, version.split('.')))
                  previous = tuple(map(int, base_version.split('.')))
                  clean_baseline_reset = (
                      base_version == '0.1.11'
                      and version == '0.0.1'
                      and head_ref == 'ghosium/0.0.1-clean-baseline'
                  )
                  release_target_correction = (
                      base_version == '0.0.3'
                      and version == '0.0.2'
                      and head_ref == 'release/0.0.2-correction'
                  )
                  if current <= previous and not (clean_baseline_reset or release_target_correction):
                      raise SystemExit(f'Ghosium VERSION must advance from {base_version}; got {version}.')
                  if clean_baseline_reset:
                      print('Authorized one-time clean baseline reset: 0.1.11 -> 0.0.1')
                  if release_target_correction:
                      print('Authorized one-time release target correction: 0.0.3 -> 0.0.2')

          print(f'Ghosium product version contract OK: {version}')

      - name: Verify proprietary product license and third-party rights
        shell: python
        run: |
          import json
          from pathlib import Path

          license_text = Path('LICENSE').read_text(encoding='utf-8')
          notices = Path('THIRD_PARTY_NOTICES.md').read_text(encoding='utf-8')
          readme = Path('README.md').read_text(encoding='utf-8')
          config = json.loads(Path('engine/branding/product.json').read_text(encoding='utf-8'))

          for required in (
              '# GHOSIUM BROWSER',
              'Proprietary Commercial Software License Agreement',
              'Open-source components remain governed by their respective licenses.',
              'THIRD_PARTY_NOTICES.md',
          ):
              if required not in license_text:
                  raise SystemExit(f'LICENSE contract is missing: {required}')
          for required in (
              '## License and third-party rights',
              'Brendigo Proprietary Commercial Software License Agreement',
              'Public repository visibility does not by itself grant an open-source license',
              'Chromium and every other third-party or open-source component remain governed by their own licenses.',
          ):
              if required not in readme:
                  raise SystemExit(f'README legal contract is missing: {required}')
          if len(notices.strip()) < 100:
              raise SystemExit('THIRD_PARTY_NOTICES.md is unexpectedly empty.')
          legal = config.get('legal', {})
          for key in ('preserveThirdPartyLicenses', 'preserveCopyrightNotices', 'preserveAttribution'):
              if legal.get(key) is not True:
                  raise SystemExit(f'Third-party legal preservation invariant disabled: {key}')

      - name: Verify source-built-only canonical release architecture
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/full-source-windows-build.yml').read_text(encoding='utf-8')
          promotion = Path('.github/workflows/release-marker-promotion-contract.yml').read_text(encoding='utf-8')
          for forbidden in ('storage.googleapis.com/chromium-browser-snapshots', 'chrome-win.zip'):
              if forbidden in text:
                  raise SystemExit(f'Precompiled snapshot input returned: {forbidden}')
          for required in (
              'workflow_dispatch:', 'ghosium-source-builder', 'GHOSIUM-SOURCE-BUILD.json',
              'GHOSIUM-PERFORMANCE.json', 'GHOSIUM-PUBLIC-SETUP.json',
              'GHOSIUM-CANONICAL-SETUP-SMOKE.json', 'GHOSIUM-UPDATE-MANIFEST.json',
              'SHA256SUMS.txt', 'autoninja -C out/Ghosium chrome mini_installer',
              '-RunRuntimeSmoke', './scripts/build-source-release-installer.ps1',
              './scripts/smoke-test-windows-installer.ps1', '-RequireAuthenticode',
              '$params.RequireSigning = $true', "if: github.ref == 'refs/heads/main'",
          ):
              if required not in text:
                  raise SystemExit(f'Full-source release invariant missing: {required}')
          for required in ('actions: read', 'release-marker-only', 'full-source-windows-build.yml', 'SHA256SUMS.txt'):
              if required not in promotion:
                  raise SystemExit(f'Release-promotion invariant missing: {required}')

      - name: Verify immutable action references
        shell: python
        run: |
          import re
          from pathlib import Path
          action = re.compile(r'^\s*uses:\s*([^\s#]+)', re.MULTILINE)
          immutable = re.compile(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}$')
          docker_digest = re.compile(r'^docker://[^@\s]+@sha256:[0-9a-f]{64}$')
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for match in action.finditer(path.read_text(encoding='utf-8')):
                  ref = match.group(1)
                  if ref.startswith('./') or immutable.fullmatch(ref) or docker_digest.fullmatch(ref):
                      continue
                  raise SystemExit(f'Mutable GitHub Action reference in {path}: {ref}')
