name: Ghosium 0.0.1 Verified Release Bridge

on:
  workflow_run:
    workflows:
      - Ghosium Full-Source Windows Build
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ghosium-0.0.1-verified-release-bridge
  cancel-in-progress: false

jobs:
  promote-and-dispatch-production:
    name: Verify exact corrected 0.0.1 candidate and dispatch production
    if: >-
      github.event.workflow_run.id == 34411339771 &&
      github.event.workflow_run.head_branch == 'ghosium/release/0.0.1' &&
      github.event.workflow_run.head_sha == 'eab14a947d8b2e176e55e9f199e23a0e50a54563'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: eab14a947d8b2e176e55e9f199e23a0e50a54563
      CANDIDATE_RUN_ID: '34411339771'
      PROMOTION_JOB_ID: '102666241199'
      RELEASE_PR: '66'
      VERSION: 0.0.1
      TAG: ghosium-v0.0.1

    steps:
      - name: Require successful exact corrected full-source candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event.workflow_run.conclusion }}" == 'success' ]] || {
            echo 'Exact corrected 0.0.1 candidate did not succeed; production dispatch is blocked.' >&2
            exit 1
          }

          run_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$CANDIDATE_SHA" ]] || { echo 'Candidate SHA drift.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == 'ghosium/release/0.0.1' ]] || { echo 'Candidate branch drift.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$run_json")" == 'workflow_dispatch' ]] || { echo 'Candidate event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' && "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]] || {
            echo 'Candidate is not completed/success.' >&2
            exit 1
          }

          artifact_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -f per_page=100)"
          artifact_name="ghosium-full-source-windows-x64-${VERSION}"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .id // empty' <<<"$artifact_json")"
          count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifact_json")"
          [[ "$count" == '1' && -n "$artifact_id" ]] || {
            echo "Expected exactly one live candidate artifact $artifact_name; found $count." >&2
            exit 1
          }
          echo "artifact_id=$artifact_id" >> "$GITHUB_ENV"

      - name: Independently verify corrected candidate evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/ghosium-candidate.zip"
          evidence_dir="$RUNNER_TEMP/ghosium-candidate"
          mkdir -p "$evidence_dir"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip_path"
          unzip -q "$zip_path" -d "$evidence_dir"

          expected=(
            Ghosium-Browser-Setup.exe
            Ghosium-Browser-Portable.exe
            Ghosium-Browser-Source-Runtime.7z
            GHOSIUM-SOURCE-BUILD.json
            GHOSIUM-PERFORMANCE.json
            GHOSIUM-BUILDER-READY.json
            GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json
            GHOSIUM-SOURCE-STAGE.json
            GHOSIUM-PUBLIC-SETUP.json
            GHOSIUM-CANONICAL-SETUP-SMOKE.json
            GHOSIUM-VERSION.txt
            GHOSIUM-LICENSE.txt
            THIRD_PARTY_NOTICES.md
            SHA256SUMS.txt
          )
          for file in "${expected[@]}"; do
            test -s "$evidence_dir/$file" || { echo "Candidate evidence is missing or empty: $file" >&2; exit 1; }
          done
          test "$(tr -d '\r\n ' < "$evidence_dir/GHOSIUM-VERSION.txt")" = "$VERSION"

          pushd "$evidence_dir" >/dev/null
          sha256sum -c SHA256SUMS.txt
          popd >/dev/null

          EVIDENCE_DIR="$evidence_dir" GHOSIUM_VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])
          version = os.environ['GHOSIUM_VERSION']

          public = json.loads((root / 'GHOSIUM-PUBLIC-SETUP.json').read_text(encoding='utf-8-sig'))
          if public.get('product') != 'Ghosium Browser' or public.get('productVersion') != version:
              raise SystemExit('Candidate Setup provenance product/version mismatch.')
          if public.get('publicSetupIsChromiumMiniInstallerRename') is not False:
              raise SystemExit('Candidate public Setup may not be a renamed Chromium mini-installer.')
          if (public.get('maintenance') or {}).get('sameSetupExecutable') is not True:
              raise SystemExit('Candidate must preserve same-Setup maintenance.')
          if public.get('portablePackage') != 'Ghosium-Browser-Portable.exe' or int(public.get('portableBytes') or 0) <= 0:
              raise SystemExit('Candidate Portable package provenance mismatch.')

          performance = json.loads((root / 'GHOSIUM-PERFORMANCE.json').read_text(encoding='utf-8-sig'))
          if performance.get('schemaVersion') != 2 or performance.get('profileMode') != 'UserDataDir':
              raise SystemExit('Candidate performance evidence schema/profile contract failed.')
          if len(performance.get('tabs') or []) != 3:
              raise SystemExit('Candidate performance evidence must contain 1/5/10-tab scenarios.')

          source = json.loads((root / 'GHOSIUM-SOURCE-BUILD.json').read_text(encoding='utf-8-sig'))
          if source.get('product') not in (None, 'Ghosium Browser'):
              raise SystemExit('Candidate source-build provenance has unexpected product identity.')

          smoke = json.loads((root / 'GHOSIUM-CANONICAL-SETUP-SMOKE.json').read_text(encoding='utf-8-sig'))
          if not isinstance(smoke, dict) or not smoke:
              raise SystemExit('Canonical Setup smoke evidence is empty or invalid.')

          print('Independent exact corrected candidate evidence verification: OK')
          PY

      - name: Require marker-only PR and source-equivalent current main
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          [[ "$(jq -r '.state' <<<"$pr_json")" == 'open' ]] || { echo 'Release PR is not open.' >&2; exit 1; }
          [[ "$(jq -r '.head.ref' <<<"$pr_json")" == 'ghosium/release/0.0.1' ]] || { echo 'Release PR branch mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"$pr_json")" == "$CANDIDATE_SHA" ]] || { echo 'Release PR head drift.' >&2; exit 1; }
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' ]] || { echo 'Release PR base mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.changed_files' <<<"$pr_json")" == '1' ]] || { echo 'Release PR is not marker-only.' >&2; exit 1; }

          files_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}/files" -f per_page=100)"
          [[ "$(jq -r 'length' <<<"$files_json")" == '1' ]] || { echo 'Release PR file list is not singular.' >&2; exit 1; }
          [[ "$(jq -r '.[0].filename' <<<"$files_json")" == '.release/ghosium-v0.0.1.request' ]] || { echo 'Release PR changed an unexpected file.' >&2; exit 1; }

          candidate_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}")"
          candidate_base="$(jq -r '.parents[0].sha' <<<"$candidate_json")"
          [[ -n "$candidate_base" && "$candidate_base" != 'null' ]] || { echo 'Unable to resolve corrected candidate parent.' >&2; exit 1; }

          candidate_diff="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${candidate_base}...${CANDIDATE_SHA}")"
          [[ "$(jq -r '.files | length' <<<"$candidate_diff")" == '1' ]] || { echo 'Corrected candidate itself is not marker-only.' >&2; exit 1; }
          [[ "$(jq -r '.files[0].filename' <<<"$candidate_diff")" == '.release/ghosium-v0.0.1.request' ]] || { echo 'Corrected candidate changed non-marker content.' >&2; exit 1; }

          main_sha="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${candidate_base}...${main_sha}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$compare_json")" == "$candidate_base" ]] || {
            echo 'Current main is not a descendant of the source baseline verified by the corrected candidate.' >&2
            exit 1
          }

          unexpected="$(jq -r '
            [.files[].filename
             | select(. != ".github/workflows/ghosium-0.0.1-release-bridge.yml")
             | select(. != ".github/workflows/ghosium-0.0.1-post-release-cleanup.yml")
             | select(. != ".github/workflows/ghosium-0.0.1-candidate-retry-dispatch.yml")]
            | unique | .[]?' <<<"$compare_json")"
          [[ -z "$unexpected" ]] || {
            echo 'Current main contains source/product changes beyond the corrected candidate baseline:' >&2
            printf '%s\n' "$unexpected" >&2
            echo 'A fresh candidate is required.' >&2
            exit 1
          }

          version="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${main_sha}" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n ')"
          [[ "$version" == "$VERSION" ]] || { echo "main VERSION is $version, expected $VERSION" >&2; exit 1; }
          echo "main_sha_before_merge=$main_sha" >> "$GITHUB_ENV"
          echo "Corrected candidate source baseline remains equivalent to current main: $candidate_base -> $main_sha"

      - name: Refuse an already-published 0.0.1 release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing duplicate production dispatch." >&2
            exit 1
          fi

      - name: Rerun corrected marker promotion workflow for audit
        shell: bash
        run: |
          set -euo pipefail
          rerun_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/jobs/${PROMOTION_JOB_ID}/rerun" >/dev/null

          for attempt in $(seq 1 120); do
            sleep 5
            checks="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs" -f per_page=100)"
            if jq -e --arg started "$rerun_started" '[.check_runs[] | select(.name == "Verify release-marker-only promotion and candidate evidence") | select(.started_at >= $started) | select(.status == "completed") | select(.conclusion == "success")] | length > 0' <<<"$checks" >/dev/null; then
              echo 'Corrected marker promotion workflow rerun: success'
              exit 0
            fi
            if jq -e --arg started "$rerun_started" '[.check_runs[] | select(.name == "Verify release-marker-only promotion and candidate evidence") | select(.started_at >= $started) | select(.status == "completed") | select(.conclusion == "failure")] | length > 0' <<<"$checks" >/dev/null; then
              echo 'Corrected marker promotion workflow rerun failed.' >&2
              exit 1
            fi
          done

          echo 'Timed out waiting for corrected marker promotion workflow rerun.' >&2
          exit 1

      - name: Merge verified marker-only release PR
        shell: bash
        run: |
          set -euo pipefail
          merge_json="$(gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}/merge" -f sha="$CANDIDATE_SHA" -f merge_method=merge)"
          [[ "$(jq -r '.merged' <<<"$merge_json")" == 'true' ]] || {
            echo 'Verified marker-only release PR did not merge.' >&2
            jq . <<<"$merge_json" >&2
            exit 1
          }

          main_sha="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${CANDIDATE_SHA}...${main_sha}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$compare_json")" == "$CANDIDATE_SHA" ]] || {
            echo 'Merged main does not contain the exact corrected candidate head.' >&2
            exit 1
          }
          echo "production_main_sha=$main_sha" >> "$GITHUB_ENV"
          echo "Verified marker PR merged; production main is $main_sha"

      - name: Require merged main contract checks
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'version-contract'
            'Verify clean 0.0.1 baseline and fail-closed repository state'
            'Verify canonical install update and uninstall architecture'
          )

          for attempt in $(seq 1 120); do
            sleep 5
            checks="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/commits/${production_main_sha}/check-runs" -f per_page=100)"
            all_ok=true
            for name in "${required[@]}"; do
              if ! jq -e --arg name "$name" '[.check_runs[] | select(.name == $name) | select(.status == "completed") | select(.conclusion == "success")] | length > 0' <<<"$checks" >/dev/null; then
                all_ok=false
              fi
              if jq -e --arg name "$name" '[.check_runs[] | select(.name == $name) | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length > 0' <<<"$checks" >/dev/null; then
                echo "Merged main required check failed: $name" >&2
                exit 1
              fi
            done
            if [[ "$all_ok" == true ]]; then
              echo 'Merged main release contracts: success'
              exit 0
            fi
          done

          echo 'Timed out waiting for merged main release contract checks.' >&2
          exit 1

      - name: Dispatch exact merged main to production full-source workflow
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$production_main_sha" ]] || {
            echo "main moved after verified merge: $production_main_sha -> $current_main" >&2
            exit 1
          }

          version="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${production_main_sha}" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n ')"
          [[ "$version" == "$VERSION" ]] || { echo "main VERSION is $version, expected $VERSION" >&2; exit 1; }

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/dispatches" -f ref=main >/dev/null

          for attempt in $(seq 1 30); do
            sleep 5
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/runs" -f branch=main -f event=workflow_dispatch -f per_page=30)"
            run_id="$(jq -r --arg sha "$production_main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              echo "Production full-source run dispatched for exact main $production_main_sha: $run_id"
              exit 0
            fi
          done

          echo "Production dispatch did not produce an exact-main workflow run for $production_main_sha." >&2
          exit 1
