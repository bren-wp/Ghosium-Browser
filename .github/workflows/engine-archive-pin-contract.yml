name: Ghosium Engine Archive Pin Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ENGINE_REVISION'
      - 'ENGINE_ARCHIVE_SHA256'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/engine-archive-pin-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-engine-archive-hash:
    name: Capture pinned engine archive SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download and hash pinned Windows engine archive
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '\r\n ' < ENGINE_REVISION)"
          [[ "$revision" =~ ^[0-9]+$ ]] || { echo 'ENGINE_REVISION must be numeric.' >&2; exit 1; }

          archive="${RUNNER_TEMP}/ghosium-engine-${revision}.zip"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/${revision}/chrome-win.zip" \
            --output "$archive"

          hash="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || { echo 'Unable to calculate engine archive SHA-256.' >&2; exit 1; }
          echo "ENGINE_ARCHIVE_SHA256=$hash"
