name: Ghosium Full-Source Windows Build

on:
  workflow_dispatch:

concurrency:
  group: ghosium-full-source-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-contract:
    name: Validate Ghosium release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate synchronized immutable version
        id: version
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'0\.[1-9]\d*\.\d+', version):
              raise SystemExit(f'Ghosium VERSION must use the 0.x.y product line: {version!r}')

          manifests = [
              Path('extension/manifest.json'),
              Path('search-provider/manifest.json'),
          ]
          for path in manifests:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('version') != version:
                  raise SystemExit(f'{path} version {data.get("version")!r} does not match VERSION {version}')
              if data.get('manifest_version') != 3:
                  raise SystemExit(f'{path} must remain Manifest V3')

          catalog_path = Path('store-web/storage/data/extensions.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          for extension in catalog.get('extensions', []):
              if extension.get('status') == 'built_in' and extension.get('version') != version:
                  raise SystemExit(
                      f'{catalog_path}: built-in {extension.get("id")} version '
                      f'{extension.get("version")!r} does not match VERSION {version}'
                  )

          license_text = Path('LICENSE').read_text(encoding='utf-8')
          if 'Proprietary Commercial Software License Agreement' not in license_text:
              raise SystemExit('Production release requires the Brendigo proprietary Ghosium license.')
          if 'Open-source components remain governed by their respective licenses.' not in license_text:
              raise SystemExit('Production license lost the required open-source/third-party rights preservation clause.')
          if not Path('THIRD_PARTY_NOTICES.md').is_file():
              raise SystemExit('Production release requires THIRD_PARTY_NOTICES.md.')

          tag = f'ghosium-v{version}'
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'version={version}\n')
              handle.write(f'tag={tag}\n')

          print(f'Ghosium release contract: {version} / {tag}')

  build-windows-source:
    name: Build pinned Ghosium engine from source
    needs: validate-release-contract
    runs-on:
      - self-hosted
      - Windows
      - X64
      - ghosium-source-builder
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GIT_TERMINAL_PROMPT: '0'
      GHOSIUM_VERSION: ${{ needs.validate-release-contract.outputs.version }}

    steps:
      - name: Checkout Ghosium source tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate source builder
        id: builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'artifacts/full-source' | Out-Null
          ./scripts/verify-source-builder-host.ps1 `
            -ReportPath 'artifacts/full-source/GHOSIUM-BUILDER-READY.json'

      - name: Verify pinned Chromium patch anchors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python3 ./scripts/verify-pinned-source-anchors.py
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Chromium source patch-anchor validation failed with exit code $LASTEXITCODE"
          }

      - name: Bootstrap pinned Chromium source
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
          REUSE_CHECKOUT: ${{ steps.builder.outputs.reuse }}
        run: |
          $ErrorActionPreference = 'Stop'
          $params = @{
            Destination = $env:WORK_ROOT
          }
          if ($env:REUSE_CHECKOUT -eq 'true') {
            $params.ReuseExisting = $true
          }
          ./scripts/bootstrap-engine-source.ps1 @params

      - name: Apply and verify Ghosium source fork
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          ./scripts/apply-engine-branding.ps1 -SourceRoot $src
          ./scripts/verify-engine-fork.ps1 -SourceRoot $src
          ./scripts/verify-engine-windows-executable.ps1 -SourceRoot $src

      - name: Configure deterministic Windows x64 build
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          ./scripts/configure-engine-build.ps1 -SourceRoot $src -OutDir 'out/Ghosium'

      - name: Compile Ghosium Browser and source archive
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
          NINJA_SUMMARIZE_BUILD: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          Push-Location $src
          try {
            # The upstream GN/Ninja target names remain technical build-system
            # dependencies. mini_installer is built only because it owns the
            # canonical chrome.7z runtime archive generation; it is not the
            # public Ghosium installer artifact.
            autoninja -C out/Ghosium chrome mini_installer
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned full-source browser compile failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Verify source-built binaries and stage evidence
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          ./scripts/verify-engine-build-output.ps1 `
            -SourceRoot $src `
            -OutDir 'out/Ghosium' `
            -ProvenancePath (Join-Path $PWD 'artifacts/full-source/GHOSIUM-SOURCE-BUILD.json') `
            -RunRuntimeSmoke

          $out = Join-Path $src 'out/Ghosium'
          Copy-Item (Join-Path $out 'chrome.7z') 'artifacts/full-source/Ghosium-Browser-Source-Runtime.7z' -Force
          Copy-Item 'LICENSE' 'artifacts/full-source/GHOSIUM-LICENSE.txt' -Force
          Copy-Item 'THIRD_PARTY_NOTICES.md' 'artifacts/full-source/THIRD_PARTY_NOTICES.md' -Force
          Set-Content 'artifacts/full-source/GHOSIUM-VERSION.txt' $env:GHOSIUM_VERSION -Encoding ascii

          if (Test-Path 'artifacts/full-source/Ghosium-Browser-Setup.exe') {
            throw 'Public Setup must not exist before the canonical source-release packaging step.'
          }

      - name: Smoke test technical source mini-installer
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          ./scripts/smoke-test-source-windows-installer.ps1 `
            -MiniInstallerPath (Join-Path $src 'out/Ghosium/mini_installer.exe') `
            -ReportPath (Join-Path $PWD 'artifacts/full-source/GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json')

      - name: Build canonical Ghosium same-Setup package
        shell: pwsh
        env:
          WORK_ROOT: ${{ steps.builder.outputs.work_root }}
          GHOSIUM_SIGN_CERT_THUMBPRINT: ${{ secrets.GHOSIUM_SIGN_CERT_THUMBPRINT }}
          GHOSIUM_TIMESTAMP_URL: ${{ vars.GHOSIUM_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WORK_ROOT 'src'
          $params = @{
            SourceRoot = $src
            OutDir = 'out/Ghosium'
            ArtifactsDir = (Join-Path $PWD 'artifacts/full-source')
            StageDir = (Join-Path $env:RUNNER_TEMP 'ghosium-canonical-source-stage')
            ReportPath = (Join-Path $PWD 'artifacts/full-source/GHOSIUM-PUBLIC-SETUP.json')
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $params.RequireSigning = $true
          }
          ./scripts/build-source-release-installer.ps1 @params

          $publicSetup = Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Setup.exe'
          $miniInstaller = Join-Path $src 'out/Ghosium/mini_installer.exe'
          if (!(Test-Path $publicSetup -PathType Leaf)) {
            throw 'Canonical public Ghosium Setup was not produced.'
          }
          if ((Get-FileHash $publicSetup -Algorithm SHA256).Hash -eq
              (Get-FileHash $miniInstaller -Algorithm SHA256).Hash) {
            throw 'Canonical public Setup must never be a renamed Chromium mini_installer.exe.'
          }

      - name: Smoke test canonical install update and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/smoke-test-windows-installer.ps1 `
            -SetupPath (Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Setup.exe') `
            -Version $env:GHOSIUM_VERSION `
            -ReportPath (Join-Path $PWD 'artifacts/full-source/GHOSIUM-CANONICAL-SETUP-SMOKE.json')

      - name: Verify release legal and packaging payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $license = Get-Content 'artifacts/full-source/GHOSIUM-LICENSE.txt' -Raw
          if (!$license.Contains('Proprietary Commercial Software License Agreement')) {
            throw 'Verified release payload is missing the Ghosium proprietary license.'
          }
          if (!$license.Contains('Open-source components remain governed by their respective licenses.')) {
            throw 'Verified release payload lost the third-party/open-source rights preservation clause.'
          }
          if (!(Test-Path 'artifacts/full-source/THIRD_PARTY_NOTICES.md' -PathType Leaf)) {
            throw 'Verified release payload is missing THIRD_PARTY_NOTICES.md.'
          }
          if ((Get-Item 'artifacts/full-source/THIRD_PARTY_NOTICES.md').Length -le 100) {
            throw 'Verified release third-party notices are unexpectedly small.'
          }

          $public = Get-Content 'artifacts/full-source/GHOSIUM-PUBLIC-SETUP.json' -Raw | ConvertFrom-Json
          if ($public.product -ne 'Ghosium Browser' -or
              $public.productVersion -ne $env:GHOSIUM_VERSION -or
              !$public.maintenance.sameSetupExecutable -or
              $public.publicSetupIsChromiumMiniInstallerRename) {
            throw 'Canonical public Setup provenance failed the release contract.'
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main' -and
              (!$public.signing.applied -or $public.signing.setupStatus -ne 'Valid')) {
            throw 'Production main release requires a Valid Authenticode canonical Setup package.'
          }

      - name: Generate signed production update manifest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/generate-update-manifest.ps1 `
            -SetupPath (Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Setup.exe') `
            -Version $env:GHOSIUM_VERSION `
            -OutputPath (Join-Path $PWD 'artifacts/full-source/GHOSIUM-UPDATE-MANIFEST.json') `
            -RequireAuthenticode

      - name: Generate verified full-source SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filesToHash = @(
            'artifacts/full-source/Ghosium-Browser-Setup.exe',
            'artifacts/full-source/Ghosium-Browser-Source-Runtime.7z',
            'artifacts/full-source/GHOSIUM-SOURCE-BUILD.json',
            'artifacts/full-source/GHOSIUM-BUILDER-READY.json',
            'artifacts/full-source/GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json',
            'artifacts/full-source/GHOSIUM-SOURCE-STAGE.json',
            'artifacts/full-source/GHOSIUM-PUBLIC-SETUP.json',
            'artifacts/full-source/GHOSIUM-CANONICAL-SETUP-SMOKE.json',
            'artifacts/full-source/GHOSIUM-VERSION.txt',
            'artifacts/full-source/GHOSIUM-LICENSE.txt',
            'artifacts/full-source/THIRD_PARTY_NOTICES.md'
          )
          if (Test-Path 'artifacts/full-source/GHOSIUM-UPDATE-MANIFEST.json' -PathType Leaf) {
            $filesToHash += 'artifacts/full-source/GHOSIUM-UPDATE-MANIFEST.json'
          }

          $hashLines = foreach ($file in $filesToHash) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Expected verified full-source artifact is missing before hashing: $file"
            }
            $item = Get-Item $file
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $hashLines | Set-Content 'artifacts/full-source/SHA256SUMS.txt' -Encoding ascii

      - name: Upload verified full-source build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghosium-full-source-windows-x64-${{ env.GHOSIUM_VERSION }}
          path: artifacts/full-source/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-source-built-release:
    name: Publish immutable source-built Ghosium release
    needs:
      - validate-release-contract
      - build-windows-source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified source-built artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ghosium-full-source-windows-x64-${{ needs.validate-release-contract.outputs.version }}
          path: artifacts

      - name: Publish immutable Ghosium release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSIUM_VERSION: ${{ needs.validate-release-contract.outputs.version }}
          GHOSIUM_TAG: ${{ needs.validate-release-contract.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GHOSIUM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GHOSIUM_TAG already exists. Existing releases are immutable; refusing to overwrite it." >&2
            exit 1
          fi

          for required in \
            artifacts/Ghosium-Browser-Setup.exe \
            artifacts/GHOSIUM-SOURCE-BUILD.json \
            artifacts/GHOSIUM-PUBLIC-SETUP.json \
            artifacts/GHOSIUM-CANONICAL-SETUP-SMOKE.json \
            artifacts/GHOSIUM-UPDATE-MANIFEST.json \
            artifacts/GHOSIUM-LICENSE.txt \
            artifacts/THIRD_PARTY_NOTICES.md \
            artifacts/SHA256SUMS.txt; do
            test -f "$required"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(Path('artifacts/GHOSIUM-PUBLIC-SETUP.json').read_text(encoding='utf-8'))
          update = json.loads(Path('artifacts/GHOSIUM-UPDATE-MANIFEST.json').read_text(encoding='utf-8'))
          if public['signing']['setupStatus'] != 'Valid' or not public['signing']['applied']:
              raise SystemExit('Refusing release: canonical Setup is not proven Authenticode-signed.')
          if public['publicSetupIsChromiumMiniInstallerRename']:
              raise SystemExit('Refusing release: public Setup is a Chromium mini-installer rename.')
          if update['sha256'] != public['packageSha256'] or update['size'] != public['packageBytes']:
              raise SystemExit('Refusing release: update manifest does not describe the exact canonical Setup package.')
          PY

          gh release create "$GHOSIUM_TAG" \
            artifacts/Ghosium-Browser-Setup.exe \
            artifacts/GHOSIUM-SOURCE-BUILD.json \
            artifacts/GHOSIUM-BUILDER-READY.json \
            artifacts/GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json \
            artifacts/GHOSIUM-SOURCE-STAGE.json \
            artifacts/GHOSIUM-PUBLIC-SETUP.json \
            artifacts/GHOSIUM-CANONICAL-SETUP-SMOKE.json \
            artifacts/GHOSIUM-UPDATE-MANIFEST.json \
            artifacts/GHOSIUM-VERSION.txt \
            artifacts/GHOSIUM-LICENSE.txt \
            artifacts/THIRD_PARTY_NOTICES.md \
            artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Ghosium Browser $GHOSIUM_VERSION" \
            --notes $'Verified Ghosium Browser Windows x64 release built from the pinned source revision.\n\nThe public Ghosium-Browser-Setup.exe is the canonical Brendigo same-Setup package, not a renamed Chromium mini_installer. It performs install, /UPDATE and /UNINSTALL maintenance, is Authenticode-signed for production, and has passed an installed runtime + update + uninstall round-trip smoke test.\n\nRelease gate: pinned source checkout, Ghosium fork application, source verification, full compile, runtime smoke, canonical source-stage assembly, source-runtime-to-Setup packaging, Authenticode publisher verification, same-Setup update/profile-preservation smoke, legal payload verification, production update-manifest binding, SHA-256 manifest, and provenance must all succeed before publication.\n\nTechnical upstream GN/Ninja target names and internal DLL/archive names may remain where a safe coordinated rename has not yet been compile/runtime proven. Third-party/open-source components remain governed by their own licenses.' \
            --repo "$GITHUB_REPOSITORY"
