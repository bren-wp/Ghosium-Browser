name: Ghosium 0.1.9 ImageMagick Artwork

on:
  push:
    branches:
      - ghosium/release/0.1.9
    paths:
      - '.release/ghosium-v0.1.9.assets-magick'

permissions:
  contents: write

jobs:
  generate-assets:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ghosium/release/0.1.9
          fetch-depth: 1

      - name: Generate real Ghosium extension and installer artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $magick = (Get-Command magick -ErrorAction Stop).Source
          & $magick -version | Out-Host
          New-Item -ItemType Directory -Force -Path 'extension/icons' | Out-Null
          New-Item -ItemType Directory -Force -Path 'installer/assets' | Out-Null

          foreach ($size in @(16,32,48,128)) {
            & $magick 'engine/branding/ghosium-mark.svg' `
              -background none `
              -resize "${size}x${size}" `
              -gravity center `
              -extent "${size}x${size}" `
              "extension/icons/$size.png"
            if ($LASTEXITCODE -ne 0) { throw "ImageMagick extension icon generation failed: $size" }
          }

          & $magick -size 150x57 'xc:#111016' `
            'engine/branding/ghosium-mark.svg' -resize 38x38 `
            -gravity west -geometry +8+0 -composite `
            -fill '#f8fafc' -font 'Segoe-UI' -pointsize 12 -gravity northwest -annotate +52+9 'GHOSIUM' `
            -fill '#a5afbe' -pointsize 7 -annotate +52+31 'Browser by Brendigo' `
            -fill '#8af0c7' -draw 'rectangle 0,50 149,56' `
            'BMP3:installer/assets/header.bmp'
          if ($LASTEXITCODE -ne 0) { throw 'Header artwork generation failed.' }

          & $magick -size 164x314 'xc:#111016' `
            'engine/branding/ghosium-mark.svg' -resize 76x76 `
            -gravity north -geometry +0+48 -composite `
            -fill '#f8fafc' -font 'Segoe-UI' -pointsize 15 -gravity north -annotate +0+142 'GHOSIUM' `
            -fill '#a5afbe' -pointsize 9 -annotate +0+176 'Browse freely. Stay private.' `
            -fill '#8af0c7' -draw 'rectangle 0,307 163,313' `
            'BMP3:installer/assets/welcome.bmp'
          if ($LASTEXITCODE -ne 0) { throw 'Welcome artwork generation failed.' }

          foreach ($path in @(
            'extension/icons/16.png','extension/icons/32.png','extension/icons/48.png','extension/icons/128.png',
            'installer/assets/header.bmp','installer/assets/welcome.bmp'
          )) {
            if (!(Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 100) {
              throw "Generated Ghosium asset is invalid: $path"
            }
          }

      - name: Commit generated artwork
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/icons installer/assets
          if (git diff --cached --quiet) {
            Write-Host 'Ghosium artwork already matches.'
            exit 0
          }
          git commit -m 'assets: add Ghosium extension and installer artwork'
          git push origin HEAD:ghosium/release/0.1.9
