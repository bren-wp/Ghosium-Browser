name: Ghosium 0.1.9 Full-Source Portable Migration

on:
  push:
    branches:
      - ghosium/release/0.1.9
    paths:
      - .release/ghosium-v0.1.9.full-source-portable

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ghosium/release/0.1.9
          fetch-depth: 1
          persist-credentials: true

      - name: Require Portable throughout canonical release chain
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/full-source-windows-build.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "          if (Test-Path 'artifacts/full-source/Ghosium-Browser-Setup.exe') {\n            throw 'Public Setup must not exist before the canonical source-release packaging step.'\n          }",
                  "          if (Test-Path 'artifacts/full-source/Ghosium-Browser-Setup.exe') {\n            throw 'Public Setup must not exist before the canonical source-release packaging step.'\n          }\n          if (Test-Path 'artifacts/full-source/Ghosium-Browser-Portable.exe') {\n            throw 'Public Portable must not exist before the canonical source-release packaging step.'\n          }",
              ),
              (
                  "      - name: Build canonical Ghosium same-Setup package",
                  "      - name: Build canonical Ghosium Setup and Portable packages",
              ),
              (
                  "          $publicSetup = Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Setup.exe'\n          $miniInstaller = Join-Path $src 'out/Ghosium/mini_installer.exe'\n          if (!(Test-Path $publicSetup -PathType Leaf)) {\n            throw 'Canonical public Ghosium Setup was not produced.'\n          }",
                  "          $publicSetup = Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Setup.exe'\n          $publicPortable = Join-Path $PWD 'artifacts/full-source/Ghosium-Browser-Portable.exe'\n          $miniInstaller = Join-Path $src 'out/Ghosium/mini_installer.exe'\n          if (!(Test-Path $publicSetup -PathType Leaf)) {\n            throw 'Canonical public Ghosium Setup was not produced.'\n          }\n          if (!(Test-Path $publicPortable -PathType Leaf)) {\n            throw 'Canonical public Ghosium Portable was not produced.'\n          }",
              ),
              (
                  "          if ($env:GITHUB_REF -eq 'refs/heads/main' -and\n              (!$public.signing.applied -or $public.signing.setupStatus -ne 'Valid')) {\n            throw 'Production main release requires a Valid Authenticode canonical Setup package.'\n          }",
                  "          if (!$public.portablePackage -or !$public.portableSha256 -or $public.portable.bytes -eq 0) {\n            throw 'Canonical public Portable provenance is incomplete.'\n          }\n          if ($env:GITHUB_REF -eq 'refs/heads/main' -and\n              (!$public.signing.applied -or $public.signing.setupStatus -ne 'Valid' -or $public.signing.portableStatus -ne 'Valid')) {\n            throw 'Production main release requires Valid Authenticode Setup and Portable packages.'\n          }",
              ),
              (
                  "            'artifacts/full-source/Ghosium-Browser-Setup.exe',\n            'artifacts/full-source/Ghosium-Browser-Source-Runtime.7z',",
                  "            'artifacts/full-source/Ghosium-Browser-Setup.exe',\n            'artifacts/full-source/Ghosium-Browser-Portable.exe',\n            'artifacts/full-source/Ghosium-Browser-Source-Runtime.7z',",
              ),
              (
                  "            artifacts/Ghosium-Browser-Setup.exe \\\n            artifacts/GHOSIUM-SOURCE-BUILD.json \\",
                  "            artifacts/Ghosium-Browser-Setup.exe \\\n            artifacts/Ghosium-Browser-Portable.exe \\\n            artifacts/GHOSIUM-SOURCE-BUILD.json \\",
              ),
              (
                  "          if public['signing']['setupStatus'] != 'Valid' or not public['signing']['applied']:\n              raise SystemExit('Refusing release: canonical Setup is not proven Authenticode-signed.')",
                  "          if public['signing']['setupStatus'] != 'Valid' or public['signing'].get('portableStatus') != 'Valid' or not public['signing']['applied']:\n              raise SystemExit('Refusing release: canonical Setup and Portable are not proven Authenticode-signed.')\n          portable = Path('artifacts/Ghosium-Browser-Portable.exe')\n          import hashlib\n          portable_digest = hashlib.sha256(portable.read_bytes()).hexdigest()\n          if portable_digest != public.get('portableSha256') or portable.stat().st_size != public.get('portableBytes'):\n              raise SystemExit('Refusing release: Portable bytes do not match canonical provenance.')",
              ),
              (
                  "            artifacts/Ghosium-Browser-Setup.exe \\\n            artifacts/GHOSIUM-SOURCE-BUILD.json \\",
                  "            artifacts/Ghosium-Browser-Setup.exe \\\n            artifacts/Ghosium-Browser-Portable.exe \\\n            artifacts/GHOSIUM-SOURCE-BUILD.json \\",
              ),
              (
                  "The public Ghosium-Browser-Setup.exe is the canonical Brendigo same-Setup package. It performs install, /UPDATE and /UNINSTALL maintenance, is Authenticode-signed for production, and has passed an installed runtime + update + uninstall round-trip smoke test.",
                  "The public Ghosium-Browser-Setup.exe is the canonical Brendigo maintenance package and Ghosium-Browser-Portable.exe is the canonical registry-free portable package from the same verified source stage. Both are Authenticode-signed for production; Setup additionally passes the installed runtime + update + uninstall round-trip smoke test.",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit('Expected full-source migration anchor is missing:\n' + old[:240])
              text = text.replace(old, new, 1)

          required = (
              "artifacts/full-source/Ghosium-Browser-Portable.exe",
              "portableStatus -ne 'Valid'",
              "artifacts/Ghosium-Browser-Portable.exe",
              "public.get('portableSha256')",
              "Ghosium-Browser-Portable.exe is the canonical registry-free portable package",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f'Portable release invariant missing after migration: {token}')

          path.write_text(text, encoding='utf-8')

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/full-source-windows-build.yml
          git diff --cached --check
          git commit -m 'release: require Portable throughout full-source publication'
          git push origin HEAD:ghosium/release/0.1.9
