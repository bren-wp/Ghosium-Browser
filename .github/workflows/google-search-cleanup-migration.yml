name: Ghosium Google Search Cleanup Migration

on:
  push:
    branches:
      - ghosium/google-search-cleanup
    paths:
      - '.github/workflows/google-search-cleanup-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Validate and apply migration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/migrate-google-search-cleanup.py
          python3 scripts/migrate-google-search-cleanup.py

      - name: Validate cleanup quality
        shell: bash
        run: |
          set -euo pipefail

          python3 -m json.tool engine/branding/product.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool store-web/storage/data/extensions.json >/dev/null
          python3 -m json.tool updates-web/windows/stable.json >/dev/null
          python3 -m py_compile scripts/verify-pinned-source-anchors.py

          pwsh -NoLogo -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            foreach ($path in @(
              "scripts/rewrite-engine-default-search.ps1",
              "scripts/apply-engine-branding.ps1",
              "scripts/verify-engine-fork.ps1"
            )) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $path), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                throw "PowerShell parser errors found in $path"
              }
            }
          '

          test ! -e search-provider
          test ! -e search-web
          test ! -e docs/SEARCH.md
          test ! -e docs/SHARED-HOSTING-SEARCH.md
          test ! -e .github/workflows/search-web-contract.yml
          test ! -e .github/workflows/production-release-dispatch.yml
          test ! -e .release/ghosium-v0.1.5.request
          test ! -e .release/ghosium-v0.1.5.production

          grep -Fq 'action="https://www.google.com/search"' extension/newtab.html
          grep -Fq 'Google Search' extension/newtab.html
          grep -Fq 'google.id,' scripts/rewrite-engine-default-search.ps1
          grep -Fq '/*use_first_as_fallback=*/true' scripts/rewrite-engine-default-search.ps1

          if git grep -n -E 'search\.ghosium\.com|search-provider|search-web' -- . ':!CHANGELOG.md'; then
            echo 'Active references to the retired Ghosium Search stack remain outside historical CHANGELOG entries.' >&2
            exit 1
          fi

          git diff --check
          echo 'Google Search cleanup validation: OK'

      - name: Commit cleaned 0.1.6 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git status --short
          git commit -m 'search: use Google and remove first-party Search stack'
          git push origin HEAD:${GITHUB_REF_NAME}
