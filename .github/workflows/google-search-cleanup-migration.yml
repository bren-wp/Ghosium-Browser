name: Ghosium Google Search Cleanup Migration

on:
  push:
    branches:
      - ghosium/google-search-cleanup
    paths:
      - '.github/workflows/google-search-cleanup-migration.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare workflow updates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare-google-search-ci.py
          python3 scripts/prepare-google-search-ci.py
          rm -rf scripts/__pycache__
          git diff --check -- .github/workflows

      - name: Validate prepared workflow changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'www.google.com' .github/workflows/brand-surface-contract.yml
          grep -Fq 'google.id,' .github/workflows/engine-source-audit.yml
          ! grep -Fq "Path('search-provider/manifest.json')" .github/workflows/full-source-windows-build.yml
          ! grep -Fq 'search-provider/manifest.json' .github/workflows/store-trust-audit.yml
          ! grep -Fq "Path('search-provider/manifest.json')" .github/workflows/version-contract.yml

      - name: Upload prepared workflow files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: google-search-cleanup-workflows
          path: |
            .github/workflows/brand-surface-contract.yml
            .github/workflows/engine-source-audit.yml
            .github/workflows/full-source-windows-build.yml
            .github/workflows/store-trust-audit.yml
            .github/workflows/version-contract.yml
          if-no-files-found: error
          retention-days: 1
