name: Ghosium Google Search Cleanup Migration

on:
  push:
    branches:
      - ghosium/google-search-cleanup
    paths:
      - '.github/workflows/google-search-cleanup-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Remove first-party Search and switch to Google
        shell: python
        run: |
          from pathlib import Path
          import json
          import shutil

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_required(path, old, new, count=1):
              text = read(path)
              occurrences = text.count(old)
              if occurrences < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {occurrences}: {old!r}')
              text = text.replace(old, new, count)
              write(path, text)

          def replace_all_required(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'{path}: required text not found: {old!r}')
              write(path, text.replace(old, new))

          # Advance the development line because this changes user-facing browser behavior.
          write('VERSION', '0.1.6\n')

          extension = json.loads(read('extension/manifest.json'))
          extension['version'] = '0.1.6'
          write('extension/manifest.json', json.dumps(extension, indent=2, ensure_ascii=False) + '\n')

          store = json.loads(read('store-web/storage/data/extensions.json'))
          store['updatedAt'] = '2026-09-08T19:40:00Z'
          kept = []
          for item in store.get('extensions', []):
              if item.get('id') == 'ghosium-search':
                  continue
              if item.get('id') == 'ghosium-privacy':
                  item['version'] = '0.1.6'
              kept.append(item)
          store['extensions'] = kept
          if any(item.get('id') == 'ghosium-search' for item in kept):
              raise SystemExit('Ghosium Search remained in Store metadata.')
          write('store-web/storage/data/extensions.json', json.dumps(store, indent=2, ensure_ascii=False) + '\n')

          stable = json.loads(read('updates-web/windows/stable.json'))
          stable['version'] = '0.1.6'
          stable['enabled'] = False
          stable['sha256'] = ''
          stable['size'] = 0
          write('updates-web/windows/stable.json', json.dumps(stable, indent=2, ensure_ascii=False) + '\n')

          product = json.loads(read('engine/branding/product.json'))
          product.get('productUrls', {}).pop('search', None)
          product['allowedProductUrls'] = [
              url for url in product.get('allowedProductUrls', [])
              if url != 'https://search.ghosium.com/'
          ]
          product['externalServices'] = {
              'defaultSearch': {
                  'name': 'Google Search',
                  'searchUrl': 'https://www.google.com/search?q={searchTerms}'
              }
          }
          write('engine/branding/product.json', json.dumps(product, indent=2, ensure_ascii=False) + '\n')

          # New Tab delegates web queries directly to Google Search. Ghosium does not proxy or operate the search endpoint.
          newtab = read('extension/newtab.html')
          replacements = {
              '<p class="eyebrow">GHOSIUM SEARCH</p>': '<p class="eyebrow">GOOGLE SEARCH</p>',
              'Fast browsing, private search and Ghosium protections in one clean experience.': 'Fast browsing, Google Search and Ghosium protections in one clean experience.',
              '<form class="search" action="https://search.ghosium.com/" method="get" role="search">': '<form class="search" action="https://www.google.com/search" method="get" role="search">',
              '<label class="sr-only" for="q">Ghosium Search</label>': '<label class="sr-only" for="q">Google Search</label>',
              'placeholder="Search with Ghosium"': 'placeholder="Search with Google"',
              '<span><strong>Ghosium Search</strong> private search</span>': '<span><strong>Google Search</strong> web search</span>',
          }
          for old, new in replacements.items():
              if old not in newtab:
                  raise SystemExit(f'extension/newtab.html: required Search surface missing: {old!r}')
              newtab = newtab.replace(old, new)
          write('extension/newtab.html', newtab)

          # Keep the reviewed upstream Chromium Google fallback intact instead of maintaining a custom search source patch.
          write('scripts/rewrite-engine-default-search.ps1', r'''param(
            [Parameter(Mandatory = $true)]
            [string]$SourceRoot
          )

          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $repoRoot = Split-Path -Parent $PSScriptRoot
          $expectedRevision = (Get-Content (Join-Path $repoRoot 'ENGINE_SOURCE_REVISION') -Raw).Trim()
          $sourceRootResolved = (Resolve-Path $SourceRoot).Path

          $actualRevision = (& git -C $sourceRootResolved rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualRevision -ne $expectedRevision) {
            throw "Refusing to verify default search on an unpinned checkout. Expected $expectedRevision; found $actualRevision"
          }

          $target = Join-Path $sourceRootResolved 'components/search_engines/template_url_prepopulate_data.cc'
          if (!(Test-Path $target -PathType Leaf)) {
            throw "Pinned Chromium search-engine source is missing: $target"
          }

          $googleFallback = @'
          std::unique_ptr<TemplateURLData> GetPrepopulatedFallbackSearch(
              PrefService& prefs,
              const std::vector<raw_ptr<const PrepopulatedEngine>>&
                  regional_prepopulated_engines) {
            return FindPrepopulatedEngineInternal(prefs, regional_prepopulated_engines,
                                                  google.id,
                                                  /*use_first_as_fallback=*/true);
          }
          '@

          $text = [IO.File]::ReadAllText($target)
          if (!$text.Contains($googleFallback)) {
            throw 'Pinned Chromium Google fallback changed; refusing an unreviewed default-search modification.'
          }

          foreach ($forbidden in @(
            'Ghosium Search',
            'search.ghosium.com',
            'prepopulate_id = 1101',
            '9e993bd9-c256-42d7-a1b1-000000001101'
          )) {
            if ($text.Contains($forbidden)) {
              throw "Retired Ghosium Search integration remains in engine source: $forbidden"
            }
          }

          $thirdPartyChanges = & git -C $sourceRootResolved status --porcelain=v1 -- third_party
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to verify third_party source state after default-search verification.'
          }
          if ($thirdPartyChanges) {
            throw 'Default-search verification found modified third_party sources; refusing to continue.'
          }

          Write-Host 'Google Search remains the reviewed Chromium distribution fallback: OK'
          '''.replace('          ', '', 1))

          apply_path = Path('scripts/apply-engine-branding.ps1')
          apply_text = apply_path.read_text(encoding='utf-8')
          old_apply = '''# Install Ghosium Search as the distribution fallback in the owned search layer.\n# This intentionally does not edit third_party engine data and does not use\n# enterprise policy to force the provider.\n& (Join-Path $PSScriptRoot 'rewrite-engine-default-search.ps1') -SourceRoot $sourceRootResolved\nif ($LASTEXITCODE -ne 0) {\n  throw 'Ghosium Search source integration failed.'\n}\n'''
          new_apply = '''# Preserve Chromium's reviewed Google Search fallback. This verification is a\n# no-op source guard: explicit user choices, policy and extension overrides keep\n# their native precedence and no Ghosium-owned search provider is injected.\n& (Join-Path $PSScriptRoot 'rewrite-engine-default-search.ps1') -SourceRoot $sourceRootResolved\nif ($LASTEXITCODE -ne 0) {\n  throw 'Google Search fallback verification failed.'\n}\n'''
          if old_apply not in apply_text:
              raise SystemExit('scripts/apply-engine-branding.ps1: legacy Search integration block not found.')
          write(apply_path, apply_text.replace(old_apply, new_apply, 1))

          verify_path = Path('scripts/verify-engine-fork.ps1')
          verify_text = verify_path.read_text(encoding='utf-8')
          verify_text = verify_text.replace("  'https://search.ghosium.com/',\n", '', 1)
          start = verify_text.find("  $searchSource = Get-Content (Join-Path $resolvedSourceRoot 'components/search_engines/template_url_prepopulate_data.cc') -Raw")
          end = verify_text.find("  $windowsIdentity = Get-Content (Join-Path $resolvedSourceRoot 'chrome/install_static/chromium_install_modes.h') -Raw", start)
          if start < 0 or end < 0:
              raise SystemExit('scripts/verify-engine-fork.ps1: Search verifier markers not found.')
          google_verify = r'''  $searchSource = Get-Content (Join-Path $resolvedSourceRoot 'components/search_engines/template_url_prepopulate_data.cc') -Raw
          foreach ($requiredGoogleFallback in @(
            'return FindPrepopulatedEngineInternal(prefs, regional_prepopulated_engines,',
            'google.id,',
            '/*use_first_as_fallback=*/true'
          )) {
            if (!$searchSource.Contains($requiredGoogleFallback)) {
              throw "Google Search fallback integration is missing: $requiredGoogleFallback"
            }
          }
          foreach ($forbiddenSearchIdentity in @(
            'Ghosium Search',
            'search.ghosium.com',
            'prepopulate_id = 1101',
            '9e993bd9-c256-42d7-a1b1-000000001101'
          )) {
            if ($searchSource.Contains($forbiddenSearchIdentity)) {
              throw "Retired Ghosium Search integration remains in engine source: $forbiddenSearchIdentity"
            }
          }

          '''
          verify_text = verify_text[:start] + google_verify + verify_text[end:]
          write(verify_path, verify_text)

          anchors = read('scripts/verify-pinned-source-anchors.py')
          anchors = anchors.replace(
              'Pinned engine fallback-search implementation no longer matches the reviewed rewrite block.',
              'Pinned engine Google fallback-search implementation no longer matches the reviewed source contract.'
          )
          write('scripts/verify-pinned-source-anchors.py', anchors)

          # Search provider is no longer a bundled component.
          full = read('.github/workflows/full-source-windows-build.yml')
          full = full.replace("              Path('search-provider/manifest.json'),\n", '', 1)
          write('.github/workflows/full-source-windows-build.yml', full)

          version_contract = read('.github/workflows/version-contract.yml')
          version_contract = version_contract.replace(
              "          for path in (Path('extension/manifest.json'), Path('search-provider/manifest.json')):\n",
              "          for path in (Path('extension/manifest.json'),):\n",
              1,
          )
          write('.github/workflows/version-contract.yml', version_contract)

          brand_path = Path('.github/workflows/brand-surface-contract.yml')
          brand = brand_path.read_text(encoding='utf-8')
          brand = brand.replace("      - 'search-provider/**'\n", '')
          brand = brand.replace("      - 'search-web/**'\n", '')
          brand = brand.replace("              Path('search-provider'),\n", '')
          brand = brand.replace("              Path('search-web'),\n", '')
          brand = brand.replace("          explicit_non_product = {Path('search-web/RESEARCH.md')}\n", "          explicit_non_product = set()\n")
          step_start = brand.find('      - name: Verify Ghosium product destinations\n')
          step_end = brand.find('      - name: Verify Ghost route contract is documented\n', step_start)
          if step_start < 0 or step_end < 0:
              raise SystemExit('brand-surface-contract.yml: destination-step markers not found.')
          new_destination_step = '''      - name: Verify first-party destinations and Google Search boundary
                shell: python
                run: |
                  from pathlib import Path
                  import re

                  ghosium_files = (
                      Path('store-web/index.php'),
                      Path('updates-web/index.php'),
                  )
                  allowed_ghosium_hosts = {
                      'ghosium.com',
                      'store.ghosium.com',
                      'updates.ghosium.com',
                  }
                  url_re = re.compile(r'https://([a-z0-9.-]+)(?:/[^\\s"\\'<>)]*)?', re.I)

                  for path in ghosium_files:
                      text = path.read_text(encoding='utf-8')
                      for host in url_re.findall(text):
                          if host.lower() not in allowed_ghosium_hosts:
                              raise SystemExit(f'Non-Ghosium product URL in {path}: https://{host}')

                  newtab = Path('extension/newtab.html').read_text(encoding='utf-8')
                  if 'action="https://www.google.com/search"' not in newtab:
                      raise SystemExit('New Tab must submit search queries directly to Google Search.')
                  if 'name="q"' not in newtab:
                      raise SystemExit('New Tab Google Search form must submit the q parameter.')
                  for forbidden in ('search.ghosium.com', 'Ghosium Search', 'Search with Ghosium'):
                      if forbidden in newtab:
                          raise SystemExit(f'Retired first-party Search surface remains in New Tab: {forbidden}')

                  newtab_hosts = {host.lower() for host in url_re.findall(newtab)}
                  allowed_newtab_hosts = allowed_ghosium_hosts | {'www.google.com'}
                  unexpected = sorted(newtab_hosts - allowed_newtab_hosts)
                  if unexpected:
                      raise SystemExit('Unexpected New Tab external destination(s): ' + ', '.join(unexpected))

                  print('Ghosium destinations + explicit Google Search boundary: OK')

          '''.replace('                ', '      ', 1)
          brand = brand[:step_start] + new_destination_step + brand[step_end:]
          write(brand_path, brand)

          # Documentation now describes Google as an external search service, not a Ghosium web product.
          readme = read('README.md')
          readme = readme.replace('The current development version is **0.1.5**.', 'The current development version is **0.1.6**.', 1)
          readme = readme.replace('- search: `https://search.ghosium.com/`\n', '- default search: **Google Search** (external service)\n', 1)
          section_start = readme.find('## Ghosium Search\n')
          section_end = readme.find('## Ghosium Store\n', section_start)
          if section_start < 0 or section_end < 0:
              raise SystemExit('README.md: Ghosium Search section markers not found.')
          search_section = '''## Search

Ghosium Browser uses **Google Search** as its default web search service. Search queries from the New Tab page are submitted directly to `https://www.google.com/search`; Ghosium does not proxy those requests and does not operate a first-party search endpoint.

The browser keeps Chromium's reviewed Google fallback behavior instead of injecting a Ghosium-specific provider. Explicit user search-engine choices, enterprise policy and extension overrides retain their native precedence.

The former `search-provider/` extension and `search-web/` server application have been removed from the current product architecture.

'''
          readme = readme[:section_start] + search_section + readme[section_end:]
          readme = readme.replace('search-provider/        Ghosium Search browser integration\n', '')
          readme = readme.replace('search-web/             shared-hosting Ghosium Search\n', '')
          write('README.md', readme)

          architecture = read('ARCHITECTURE.md')
          architecture = architecture.replace('Ghosium Browser 0.1.2', 'Ghosium Browser 0.1.6')
          architecture = architecture.replace('Version 0.1.2', 'Version 0.1.6')
          architecture = architecture.replace('For 0.1.2:', 'For 0.1.6:')
          arch_start = architecture.find('## Search, Store and update services\n')
          arch_end = architecture.find('## Update trust boundary\n', arch_start)
          if arch_start < 0 or arch_end < 0:
              raise SystemExit('ARCHITECTURE.md: Search services section markers not found.')
          service_section = '''## Search and first-party web services

Ghosium does not operate or bundle a first-party web search service. The browser's default search and New Tab search form use Google Search as an external service and submit queries directly to Google.

The independently deployable Ghosium-controlled shared-hosting services are limited to:

```text
store-web/       store.ghosium.com
updates-web/     updates.ghosium.com
```

These web applications are not linked into the browser executable and can be deployed independently.

'''
          architecture = architecture[:arch_start] + service_section + architecture[arch_end:]
          write('ARCHITECTURE.md', architecture)

          write('docs/WEB-SERVICES.md', '''# Ghosium web services deployment note

Ghosium Browser 0.1.6 does not ship or operate a first-party web search service. Browser and New Tab searches use Google Search as an external service.

The repository keeps only the Ghosium-controlled shared-hosting services needed for product distribution:

- Store source: `store-web/`
- Update source: `updates-web/`
- Store deployment guide: `docs/SHARED-HOSTING-STORE.md`

Search provider extensions, search server code and Search deployment assets are intentionally absent.
''')

          changelog = read('CHANGELOG.md')
          entry = '''# Changelog

## 0.1.6 — Google Search default and Search stack removal

### Search simplification
- Switched the browser and New Tab default web search experience to Google Search.
- Removed the bundled Ghosium Search provider extension and the complete first-party `search-web/` PHP search service.
- Removed Search-only deployment documentation and CI that no longer represent the product architecture.
- Preserved Chromium's reviewed Google fallback instead of maintaining a custom default-search source patch, reducing source delta and maintenance risk.
- Preserved explicit user search-engine choices, enterprise policy and extension override precedence.

### Code quality and privacy
- Removed stale Search metadata from product URL allowlists and the built-in Store catalog.
- Kept Ghosium Privacy declarative tracker protection independent from search-provider removal.
- Updated public-surface CI so `www.google.com` is allowed only for the intentional New Tab search action while Ghosium-controlled product links remain restricted to approved first-party hosts.
- Advanced the browser, bundled Ghosium Privacy component and fail-closed update baseline to 0.1.6; the stable updater remains disabled until a real signed production package exists.

'''
          if not changelog.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG.md: unexpected heading.')
          changelog = entry + changelog[len('# Changelog\n\n'):]
          write('CHANGELOG.md', changelog)

          # Delete the retired Search stack and its dedicated contracts/docs.
          for directory in ('search-provider', 'search-web'):
              path = Path(directory)
              if path.exists():
                  shutil.rmtree(path)
          for file_name in (
              'docs/SEARCH.md',
              'docs/SHARED-HOSTING-SEARCH.md',
              '.github/workflows/search-web-contract.yml',
              '.release/ghosium-v0.1.5.request',
              '.release/ghosium-v0.1.5.production',
              '.github/workflows/production-release-dispatch.yml',
          ):
              path = Path(file_name)
              if path.exists():
                  path.unlink()

          # The migration workflow is one-shot and must not become product/CI debt.
          migration = Path('.github/workflows/google-search-cleanup-migration.yml')
          if migration.exists():
              migration.unlink()

      - name: Validate cleanup quality
        shell: bash
        run: |
          set -euo pipefail

          python3 -m json.tool engine/branding/product.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool store-web/storage/data/extensions.json >/dev/null
          python3 -m json.tool updates-web/windows/stable.json >/dev/null
          python3 -m py_compile scripts/verify-pinned-source-anchors.py

          pwsh -NoLogo -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            foreach ($path in @(
              "scripts/rewrite-engine-default-search.ps1",
              "scripts/apply-engine-branding.ps1",
              "scripts/verify-engine-fork.ps1"
            )) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $path), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.Message }
                throw "PowerShell parser errors found in $path"
              }
            }
          '

          test ! -e search-provider
          test ! -e search-web
          test ! -e docs/SEARCH.md
          test ! -e docs/SHARED-HOSTING-SEARCH.md
          test ! -e .github/workflows/search-web-contract.yml
          test ! -e .github/workflows/production-release-dispatch.yml
          test ! -e .release/ghosium-v0.1.5.request
          test ! -e .release/ghosium-v0.1.5.production

          grep -Fq 'action="https://www.google.com/search"' extension/newtab.html
          grep -Fq 'Google Search' extension/newtab.html
          grep -Fq 'google.id,' scripts/rewrite-engine-default-search.ps1
          grep -Fq '/*use_first_as_fallback=*/true' scripts/rewrite-engine-default-search.ps1

          if git grep -n -E 'search\.ghosium\.com|search-provider|search-web' -- . ':!CHANGELOG.md'; then
            echo 'Active references to the retired Ghosium Search stack remain outside historical CHANGELOG entries.' >&2
            exit 1
          fi

          if git grep -n -E 'Ghosium Search' -- . ':!CHANGELOG.md' ':!docs/WEB-SERVICES.md' ':!README.md' ':!scripts/rewrite-engine-default-search.ps1' ':!scripts/verify-engine-fork.ps1'; then
            echo 'Unexpected active Ghosium Search product references remain.' >&2
            exit 1
          fi

          git diff --check
          echo 'Google Search cleanup validation: OK'

      - name: Commit cleaned 0.1.6 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git status --short
          git commit -m 'search: use Google and remove first-party Search stack'
          git push origin HEAD:${GITHUB_REF_NAME}
