name: Ghosium Google Search Cleanup Migration

on:
  push:
    branches:
      - ghosium/google-search-cleanup
    paths:
      - '.github/workflows/google-search-cleanup-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate-google-search-cleanup.py
          python3 scripts/migrate-google-search-cleanup-pass2.py
          python3 scripts/migrate-google-search-cleanup-pass3.py

      - name: Validate cleanup quality
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool engine/branding/product.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool store-web/storage/data/extensions.json >/dev/null
          python3 -m json.tool updates-web/windows/stable.json >/dev/null
          php -l scripts/verify-store.php
          php -l store-web/index.php

          pwsh -NoLogo -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            foreach ($path in @(
              "scripts/rewrite-engine-default-search.ps1",
              "scripts/apply-engine-branding.ps1",
              "scripts/verify-engine-fork.ps1"
            )) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) { throw "PowerShell parser errors found in $path" }
            }
          '

          test ! -e search-provider
          test ! -e search-web
          grep -Fq 'action="https://www.google.com/search"' extension/newtab.html
          grep -Fq 'Google Search' extension/newtab.html
          grep -Fq 'google.id,' scripts/rewrite-engine-default-search.ps1
          grep -Fq '/*use_first_as_fallback=*/true' scripts/rewrite-engine-default-search.ps1
          git diff --check

      - name: Commit product cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          find scripts -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Unexpected workflow changes in product commit.' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo 'Generated Python bytecode found in product commit.' >&2
            exit 1
          fi
          git commit -m 'search: use Google and remove first-party Search stack'
          git push origin HEAD:${GITHUB_REF_NAME}
