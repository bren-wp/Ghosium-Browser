name: Ghosium Security and Stability Hardening Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/ghosium.nsi'
      - 'extension/newtab.html'
      - 'extension/newtab.css'
      - 'extension/newtab.js'
      - 'scripts/benchmark-ghosium-windows.ps1'
      - 'scripts/benchmark-browser-comparison-windows.ps1'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/harden-engine-version-updater.ps1'
      - 'scripts/verify-engine-version-updater.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/hardening-contract.yml'
  push:
    branches: [main]
    paths:
      - 'installer/ghosium.nsi'
      - 'extension/newtab.html'
      - 'extension/newtab.css'
      - 'extension/newtab.js'
      - 'scripts/benchmark-ghosium-windows.ps1'
      - 'scripts/benchmark-browser-comparison-windows.ps1'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/harden-engine-version-updater.ps1'
      - 'scripts/verify-engine-version-updater.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/hardening-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-contract:
    name: Verify updater, installer, toolchain and benchmark isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse hardened PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/benchmark-ghosium-windows.ps1',
            'scripts/benchmark-browser-comparison-windows.ps1',
            'scripts/resolve-nsis.ps1',
            'scripts/harden-engine-version-updater.ps1',
            'scripts/verify-engine-version-updater.ps1',
            'scripts/generate-update-manifest.ps1',
            'scripts/smoke-test-windows-installer.ps1',
            'scripts/smoke-test-installer-contract-fixture.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parser errors found in $path"
            }
          }

      - name: Verify benchmark process ownership boundaries
        shell: python
        run: |
          from pathlib import Path

          ghosium = Path('scripts/benchmark-ghosium-windows.ps1').read_text(encoding='utf-8')
          comparison = Path('scripts/benchmark-browser-comparison-windows.ps1').read_text(encoding='utf-8')

          for required in (
              'BenchmarkRootProcessIds',
              'Get-Process -Name $name',
              'Assert-NoPreExistingGhosium',
              'Stop-BenchmarkOwnedProcesses',
              'Get-CimInstance Win32_Process',
              'Stop-Process -Id $processId',
              'The benchmark never terminates user-owned Ghosium processes.',
          ):
              if required not in ghosium:
                  raise SystemExit(f'Ghosium benchmark ownership invariant missing: {required}')

          for forbidden in (
              'Get-Process -ErrorAction SilentlyContinue | Where-Object',
              'Stop-Process -Force -ErrorAction SilentlyContinue',
          ):
              if forbidden in ghosium:
                  raise SystemExit(f'Unsafe broad Ghosium benchmark process handling returned: {forbidden}')

          for required in (
              'Get-Process -Name $ProcessName',
              'Assert-BrowserIdle',
              'Stop-OwnedProcessTree',
              'Get-CimInstance Win32_Process',
              'Stop-Process -Id $processId',
              'Existing user browser processes are never terminated by this benchmark.',
              'Skipped because an existing user session is running',
          ):
              if required not in comparison:
                  raise SystemExit(f'Cross-browser benchmark ownership invariant missing: {required}')

          for forbidden in (
              'function Stop-Browser {',
              'Get-Process -Name $Browser.process | Stop-Process',
          ):
              if forbidden in comparison:
                  raise SystemExit(f'Unsafe broad cross-browser cleanup returned: {forbidden}')

          print('Benchmark process ownership boundaries: OK')

      - name: Verify NSIS supply-chain restrictions
        shell: python
        run: |
          from pathlib import Path

          text = Path('scripts/resolve-nsis.ps1').read_text(encoding='utf-8')
          for required in (
              "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip",
              "56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f",
              'Test-TrustedProgramFilesPath',
              'Test-PinnedArchive',
              "--proto '=https'",
              "--proto-redir '=https'",
              '--max-time 300',
              'Get-FileHash $archive -Algorithm SHA256',
          ):
              if required not in text:
                  raise SystemExit(f'NSIS supply-chain invariant missing: {required}')

          program_files_probe = text.index("'C:\\Program Files (x86)\\NSIS\\makensis.exe'")
          path_probe = text.index('Get-Command makensis.exe')
          if program_files_probe > path_probe:
              raise SystemExit('NSIS PATH lookup must not precede canonical Program Files locations.')
          if 'Ignoring PATH makensis outside trusted Program Files roots' not in text:
              raise SystemExit('NSIS resolver must explicitly reject untrusted PATH locations.')
          print('NSIS supply-chain restrictions: OK')

      - name: Verify native updater staging and trust order
        shell: python
        run: |
          from pathlib import Path

          harden = Path('scripts/harden-engine-version-updater.ps1').read_text(encoding='utf-8')
          verify = Path('scripts/verify-engine-version-updater.ps1').read_text(encoding='utf-8')
          installer = Path('installer/ghosium.nsi').read_text(encoding='utf-8')

          for text, label in ((harden, 'hardener'), (verify, 'verifier')):
              for required in (
                  'base::GetSecureTempDirectory(&secure_temp_dir)',
                  'base::CreateTemporaryDirInDir(',
                  'FILE_PATH_LITERAL("session-")',
                  'base::win::IsBinaryTrusted',
                  'FileVersionInfo::CreateFileVersionInfo(setup_path_)',
              ):
                  if required not in text:
                      raise SystemExit(f'Updater {label} invariant missing: {required}')
          if "base::GetTempDir(&temp_dir)')" not in harden:
              raise SystemExit('Updater hardener must explicitly reject the legacy generic temp path.')
          for required in ('secureTemp', 'sessionDir', 'setupDownload', 'hashCheck', 'publisherCheck', 'identityCheck', 'versionBinding', 'launch'):
              if required not in verify:
                  raise SystemExit(f'Updater trust-order verifier missing index: {required}')

          for required in (
              'Var GhosiumUpdateCleanupPath',
              '${GetOptions} $R0 "/CLEANUPDATE=" $R1',
              'GetFullPathName $R5 $GhosiumUpdateCleanupPath',
              '${GetFileName} "$R5" $R6',
              '${GetParent} "$R5" $R6',
              '${GetParent} "$R6" $R7',
              'GetFullPathName $R8 "${UPDATE_DIR}"',
              'StrCmp $R7 "session-" update_cleanup_dynamic_verified update_cleanup_invalid',
              'Delete /REBOOTOK "$R5"',
              'RMDir /REBOOTOK "$R6"',
              '/S /CLEANUPDATE="$EXEPATH"',
          ):
              if required not in installer:
                  raise SystemExit(f'Installer secure update-cleanup invariant missing: {required}')

          dynamic_start = installer.index('update_cleanup_dynamic:')
          dynamic_end = installer.index('update_cleanup_invalid:')
          dynamic_region = installer[dynamic_start:dynamic_end]
          if 'RMDir /r' in dynamic_region:
              raise SystemExit('Dynamic update cleanup must never recursively delete a session directory.')
          print('Native updater secure staging, installer cleanup validation and trust order: OK')

      - name: Verify atomic manifest and installer fixture hardening
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('scripts/generate-update-manifest.ps1').read_text(encoding='utf-8')
          for required in (
              '$allowedProductVersions = @($Version, "$Version.0")',
              "[IO.File]::GetRandomFileName()",
              '[IO.File]::Move($tempOutput, $outputFullPath, $true)',
              'Assert-ManifestContent -Path $tempOutput',
              'Assert-ManifestContent -Path $outputFullPath',
              '$finalSha256 = (Get-FileHash $resolvedSetup -Algorithm SHA256).Hash.ToLowerInvariant()',
              'Setup changed while the update manifest was being generated',
          ):
              if required not in manifest:
                  raise SystemExit(f'Atomic update-manifest invariant missing: {required}')
          if '-notlike "$Version*"' in manifest:
              raise SystemExit('Update manifest generator returned to wildcard PE ProductVersion matching.')

          smoke = Path('scripts/smoke-test-windows-installer.ps1').read_text(encoding='utf-8')
          for required in (
              '$updateSession = Join-Path $updateDir "session-smoke-$PID"',
              'sessionDirectoryCleanupCompleted = $updateSessionCleanupCompleted',
              'secureSessionStaging = $true',
          ):
              if required not in smoke:
                  raise SystemExit(f'Canonical Setup secure-session smoke invariant missing: {required}')

          fixture = Path('scripts/smoke-test-installer-contract-fixture.ps1').read_text(encoding='utf-8')
          for required in (
              'function Test-GhosiumProductVersion',
              '$portableProcess.WaitForExit(60000)',
              '$smoke.update.secureSessionStaging',
              '$smoke.update.sessionDirectoryCleanupCompleted',
              'Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue',
          ):
              if required not in fixture:
                  raise SystemExit(f'Installer fixture stability invariant missing: {required}')
          if '-notlike "$version*"' in fixture:
              raise SystemExit('Installer fixture returned to wildcard PE ProductVersion matching.')
          print('Atomic manifest and installer fixture hardening: OK')

      - name: Verify low-overhead New Tab rendering
        shell: python
        run: |
          from pathlib import Path

          html = Path('extension/newtab.html').read_text(encoding='utf-8')
          css = Path('extension/newtab.css').read_text(encoding='utf-8')
          js = Path('extension/newtab.js').read_text(encoding='utf-8')

          if 'class="aurora ' in html:
              raise SystemExit('Redundant fixed New Tab aurora blur layers returned.')
          if 'backdrop-filter:' in css or 'filter: blur(' in css:
              raise SystemExit('New Tab must not depend on full-surface blur/backdrop compositing.')
          for required in (
              'const settingKeys = Object.freeze(Object.keys(defaults));',
              "const nav = document.querySelector('.product-nav');",
              "const status = document.querySelector('.status');",
              'Object.hasOwn(changes, key)',
              'if (relevantChange) apply(next);',
          ):
              if required not in js:
                  raise SystemExit(f'New Tab low-overhead JS invariant missing: {required}')
          print('Low-overhead New Tab rendering/state updates: OK')
