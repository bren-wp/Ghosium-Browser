name: Ghosium 0.0.1 Verified Post-Merge Continuation

on:
  workflow_run:
    workflows:
      - Ghosium Full-Source Windows Build
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ghosium-0.0.1-verified-post-merge-continuation
  cancel-in-progress: false

jobs:
  verify-and-dispatch-production:
    name: Verify exact candidate after marker merge and dispatch production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.id == 34411339771 &&
       github.event.workflow_run.head_branch == 'ghosium/release/0.0.1' &&
       github.event.workflow_run.head_sha == 'eab14a947d8b2e176e55e9f199e23a0e50a54563')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.0.1
      TAG: ghosium-v0.0.1
      CANDIDATE_RUN_ID: '34411339771'
      CANDIDATE_SHA: eab14a947d8b2e176e55e9f199e23a0e50a54563
      RELEASE_PR: '66'

    steps:
      - name: Require successful exact corrected candidate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == 'workflow_run' && "${{ github.event.workflow_run.conclusion }}" != 'success' ]]; then
            echo 'Exact corrected candidate did not succeed; production remains blocked.' >&2
            exit 1
          fi

          run_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$CANDIDATE_SHA" ]] || { echo 'Candidate SHA drift.' >&2; exit 1; }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == 'ghosium/release/0.0.1' ]] || { echo 'Candidate branch drift.' >&2; exit 1; }
          [[ "$(jq -r '.event' <<<"$run_json")" == 'workflow_dispatch' ]] || { echo 'Candidate event mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]] || { echo 'Candidate has not completed.' >&2; exit 1; }
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]] || { echo 'Candidate conclusion is not success.' >&2; exit 1; }

          artifact_name="ghosium-full-source-windows-x64-${VERSION}"
          artifacts_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts" -f per_page=100)"
          count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | .[0].id // empty' <<<"$artifacts_json")"
          [[ "$count" == '1' && -n "$artifact_id" ]] || {
            echo "Expected exactly one live candidate artifact $artifact_name; found $count." >&2
            exit 1
          }
          echo "artifact_id=$artifact_id" >> "$GITHUB_ENV"

      - name: Independently verify candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/ghosium-candidate.zip"
          evidence_dir="$RUNNER_TEMP/ghosium-candidate"
          mkdir -p "$evidence_dir"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip_path"
          unzip -q "$zip_path" -d "$evidence_dir"

          expected=(
            Ghosium-Browser-Setup.exe
            Ghosium-Browser-Portable.exe
            Ghosium-Browser-Source-Runtime.7z
            GHOSIUM-SOURCE-BUILD.json
            GHOSIUM-PERFORMANCE.json
            GHOSIUM-BUILDER-READY.json
            GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json
            GHOSIUM-SOURCE-STAGE.json
            GHOSIUM-PUBLIC-SETUP.json
            GHOSIUM-CANONICAL-SETUP-SMOKE.json
            GHOSIUM-VERSION.txt
            GHOSIUM-LICENSE.txt
            THIRD_PARTY_NOTICES.md
            SHA256SUMS.txt
          )
          for file in "${expected[@]}"; do
            test -s "$evidence_dir/$file" || { echo "Candidate evidence is missing or empty: $file" >&2; exit 1; }
          done
          test "$(tr -d '\r\n ' < "$evidence_dir/GHOSIUM-VERSION.txt")" = "$VERSION"

          pushd "$evidence_dir" >/dev/null
          sha256sum -c SHA256SUMS.txt
          popd >/dev/null

          EVIDENCE_DIR="$evidence_dir" GHOSIUM_VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])
          version = os.environ['GHOSIUM_VERSION']

          public = json.loads((root / 'GHOSIUM-PUBLIC-SETUP.json').read_text(encoding='utf-8-sig'))
          if public.get('schemaVersion') != 3:
              raise SystemExit('Candidate public Setup provenance schema mismatch.')
          if public.get('product') != 'Ghosium Browser' or public.get('productVersion') != version:
              raise SystemExit('Candidate Setup provenance product/version mismatch.')
          if public.get('publicSetupIsChromiumMiniInstallerRename') is not False:
              raise SystemExit('Candidate public Setup may not be a renamed Chromium mini-installer.')
          if (public.get('maintenance') or {}).get('sameSetupExecutable') is not True:
              raise SystemExit('Candidate must preserve same-Setup maintenance.')
          if public.get('portablePackage') != 'Ghosium-Browser-Portable.exe' or int(public.get('portableBytes') or 0) <= 0:
              raise SystemExit('Candidate Portable provenance mismatch.')
          portable = public.get('portable') or {}
          if portable.get('registryFree') is not True or portable.get('createsShortcuts') is not False or portable.get('profileSwitch') != '--user-data-dir':
              raise SystemExit('Candidate Portable isolation contract failed.')

          performance = json.loads((root / 'GHOSIUM-PERFORMANCE.json').read_text(encoding='utf-8-sig'))
          if performance.get('schemaVersion') != 2 or performance.get('profileMode') != 'UserDataDir':
              raise SystemExit('Candidate performance evidence schema/profile contract failed.')
          if len(performance.get('tabs') or []) != 3:
              raise SystemExit('Candidate performance evidence must contain 1/5/10-tab scenarios.')

          source = json.loads((root / 'GHOSIUM-SOURCE-BUILD.json').read_text(encoding='utf-8-sig'))
          if source.get('product') not in (None, 'Ghosium Browser'):
              raise SystemExit('Candidate source-build provenance has unexpected product identity.')

          smoke = json.loads((root / 'GHOSIUM-CANONICAL-SETUP-SMOKE.json').read_text(encoding='utf-8-sig'))
          if not isinstance(smoke, dict) or not smoke:
              raise SystemExit('Canonical Setup smoke evidence is empty or invalid.')

          print('Post-merge independent candidate evidence verification: OK')
          PY

      - name: Verify exact marker merge and source-equivalent current main
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          [[ "$(jq -r '.merged' <<<"$pr_json")" == 'true' ]] || { echo 'Release PR is not merged.' >&2; exit 1; }
          [[ "$(jq -r '.head.sha' <<<"$pr_json")" == "$CANDIDATE_SHA" ]] || { echo 'Merged release PR head drift.' >&2; exit 1; }
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' ]] || { echo 'Merged release PR base mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.changed_files' <<<"$pr_json")" == '1' ]] || { echo 'Merged release PR was not marker-only.' >&2; exit 1; }
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"
          [[ -n "$merge_sha" ]] || { echo 'Merged release PR has no merge commit SHA.' >&2; exit 1; }

          files_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}/files" -f per_page=100)"
          [[ "$(jq -r 'length' <<<"$files_json")" == '1' ]] || { echo 'Merged release PR file list is not singular.' >&2; exit 1; }
          [[ "$(jq -r '.[0].filename' <<<"$files_json")" == '.release/ghosium-v0.0.1.request' ]] || { echo 'Merged release PR changed an unexpected file.' >&2; exit 1; }
          [[ "$(jq -r '.[0].status' <<<"$files_json")" == 'added' ]] || { echo 'Merged release marker was not added.' >&2; exit 1; }

          marker="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/contents/.release/ghosium-v0.0.1.request?ref=${CANDIDATE_SHA}" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n ')"
          [[ "$marker" == "$TAG" ]] || { echo 'Candidate release marker content mismatch.' >&2; exit 1; }

          candidate_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}")"
          candidate_base="$(jq -r '.parents[0].sha // empty' <<<"$candidate_json")"
          [[ -n "$candidate_base" ]] || { echo 'Unable to resolve candidate source baseline.' >&2; exit 1; }

          main_sha="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate_to_main="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${CANDIDATE_SHA}...${main_sha}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$candidate_to_main")" == "$CANDIDATE_SHA" ]] || {
            echo 'Current main does not contain the exact corrected candidate.' >&2
            exit 1
          }

          merge_to_main="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${merge_sha}...${main_sha}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$merge_to_main")" == "$merge_sha" ]] || {
            echo 'Current main is not a descendant of the exact release merge commit.' >&2
            exit 1
          }

          baseline_to_main="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/compare/${candidate_base}...${main_sha}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<<"$baseline_to_main")" == "$candidate_base" ]] || {
            echo 'Current main is not a descendant of the candidate source baseline.' >&2
            exit 1
          }
          unexpected="$(jq -r '
            [.files[].filename
             | select(. != ".release/ghosium-v0.0.1.request")
             | select(. != ".github/workflows/ghosium-0.0.1-release-bridge.yml")
             | select(. != ".github/workflows/ghosium-0.0.1-post-release-cleanup.yml")
             | select(. != ".github/workflows/ghosium-0.0.1-candidate-retry-dispatch.yml")]
            | unique | .[]?' <<<"$baseline_to_main")"
          [[ -z "$unexpected" ]] || {
            echo 'Current main contains source/product changes not covered by exact candidate evidence:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

          version="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${main_sha}" --jq '.content' | tr -d '\n' | base64 --decode | tr -d '\r\n ')"
          [[ "$version" == "$VERSION" ]] || { echo "main VERSION is $version, expected $VERSION" >&2; exit 1; }
          echo "production_main_sha=$main_sha" >> "$GITHUB_ENV"
          echo "Verified post-merge source equivalence for production main $main_sha"

      - name: Require current main release contracts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'version-contract'
            'Verify clean 0.0.1 baseline and fail-closed repository state'
            'Verify canonical install update and uninstall architecture'
          )

          for attempt in $(seq 1 120); do
            checks="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/commits/${production_main_sha}/check-runs" -f per_page=100)"
            all_ok=true
            for name in "${required[@]}"; do
              if jq -e --arg name "$name" '[.check_runs[] | select(.name == $name) | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length > 0' <<<"$checks" >/dev/null; then
                echo "Required main check failed: $name" >&2
                exit 1
              fi
              if ! jq -e --arg name "$name" '[.check_runs[] | select(.name == $name) | select(.status == "completed") | select(.conclusion == "success")] | length > 0' <<<"$checks" >/dev/null; then
                all_ok=false
              fi
            done
            if [[ "$all_ok" == true ]]; then
              echo 'Current production main contracts: success'
              exit 0
            fi
            sleep 5
          done

          echo 'Timed out waiting for current production main contract checks.' >&2
          exit 1

      - name: Dispatch exact verified main to production once
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" == "$production_main_sha" ]] || {
            echo "main moved after post-merge verification: $production_main_sha -> $current_main" >&2
            exit 1
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
            [[ "$(jq -r '.draft' <<<"$release_json")" == 'false' && "$(jq -r '.prerelease' <<<"$release_json")" == 'false' ]] || {
              echo 'Existing 0.0.1 release is draft/prerelease; refusing to treat it as canonical.' >&2
              exit 1
            }
            for asset in Ghosium-Browser-Setup.exe Ghosium-Browser-Portable.exe GHOSIUM-SOURCE-BUILD.json GHOSIUM-PERFORMANCE.json GHOSIUM-PUBLIC-SETUP.json GHOSIUM-CANONICAL-SETUP-SMOKE.json GHOSIUM-UPDATE-MANIFEST.json SHA256SUMS.txt; do
              [[ "$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")" == '1' ]] || {
                echo "Existing 0.0.1 release is missing canonical asset $asset." >&2
                exit 1
              }
            done
            echo 'Canonical 0.0.1 already exists; no duplicate production dispatch.'
            exit 0
          fi

          runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/runs" -f branch=main -f event=workflow_dispatch -f per_page=100)"
          active="$(jq -r --arg sha "$production_main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch") | select(.status == "queued" or .status == "in_progress")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          if [[ -n "$active" ]]; then
            echo "Exact production main already has active full-source run $active; no duplicate dispatch."
            exit 0
          fi

          succeeded="$(jq -r --arg sha "$production_main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch") | select(.status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          if [[ -n "$succeeded" ]]; then
            echo "Production run $succeeded succeeded for exact main but canonical release is absent; refusing blind duplicate dispatch." >&2
            exit 1
          fi

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/dispatches" -f ref=main >/dev/null

          for attempt in $(seq 1 30); do
            sleep 5
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/runs" -f branch=main -f event=workflow_dispatch -f per_page=100)"
            run_id="$(jq -r --arg sha "$production_main_sha" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              echo "Verified production full-source run dispatched: $run_id / $production_main_sha"
              exit 0
            fi
          done

          echo 'Production dispatch did not produce an exact-main full-source run.' >&2
          exit 1
