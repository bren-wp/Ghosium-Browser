name: Ghosium Public Surface Contract

on:
  pull_request:
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'engine/branding/**'
      - 'scripts/rewrite-engine-public-surfaces.ps1'
      - 'scripts/verify-engine-public-surfaces.ps1'
      - 'scripts/rebrand-engine-locales.ps1'
      - 'scripts/verify-engine-locales.ps1'
      - 'scripts/generate-engine-brand-assets.py'
      - '.github/workflows/public-surface-contract.yml'
  push:
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'engine/branding/**'
      - 'scripts/rewrite-engine-public-surfaces.ps1'
      - 'scripts/verify-engine-public-surfaces.ps1'
      - 'scripts/rebrand-engine-locales.ps1'
      - 'scripts/verify-engine-locales.ps1'
      - 'scripts/generate-engine-brand-assets.py'
      - '.github/workflows/public-surface-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Ghosium tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }
          python3 -m py_compile scripts/generate-engine-brand-assets.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Ghosium deterministic brand-asset generator has syntax errors.'
          }

        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/ghosium-public-source"
          revision="$(tr -d '\r\n ' < ENGINE_SOURCE_REVISION)"

          git init "$src"
          git -C "$src" remote add origin https://github.com/chromium/chromium.git
          git -C "$src" config core.sparseCheckout true
          mkdir -p "$src/.git/info"
          cat > "$src/.git/info/sparse-checkout" <<'EOF'
          /chrome/app/chromium_strings.grd
          /chrome/app/settings_chromium_strings.grdp
          /chrome/app/settings_strings.grdp
          /chrome/app/shared_settings_strings.grdp
          /chrome/app/glic_strings.grdp
          /chrome/app/resources/
          /chrome/app/theme/chromium/
          /chrome/app/theme/default_100_percent/chromium/
          /chrome/app/theme/default_200_percent/chromium/
          /chrome/browser/extensions/extension_ui_util.cc
          /components/strings/
          /extensions/strings/
          EOF

          git -C "$src" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$revision"
          echo "PUBLIC_ENGINE_SRC=$src" >> "$GITHUB_ENV"

          python3 ./scripts/generate-engine-brand-assets.py $env:PUBLIC_ENGINE_SRC
          if ($LASTEXITCODE -ne 0) {
            throw "Ghosium brand-asset generation failed with exit code $LASTEXITCODE"
          }

        shell: bash
        run: |
          set -euo pipefail
          src="$PUBLIC_ENGINE_SRC"

          grep -F 'About Ghosium Browser' "$src/chrome/app/settings_chromium_strings.grdp"
