name: Ghosium Full-Source Engine Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ENGINE_REVISION'
      - 'ENGINE_SOURCE_REVISION'
      - 'VERSION'
      - 'engine/**'
      - 'scripts/*engine*.ps1'
      - 'scripts/generate-engine-brand-assets.py'
      - '.github/workflows/engine-source-audit.yml'
      - '.github/workflows/full-source-windows-build.yml'
  push:
    branches:
      - main
    paths:
      - 'ENGINE_REVISION'
      - 'ENGINE_SOURCE_REVISION'
      - 'VERSION'
      - 'engine/**'
      - 'scripts/*engine*.ps1'
      - 'scripts/generate-engine-brand-assets.py'
      - '.github/workflows/engine-source-audit.yml'
      - '.github/workflows/full-source-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: Verify pinned source and Ghosium invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate source transformation tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/bootstrap-engine-source.ps1',
            'scripts/apply-engine-branding.ps1',
            'scripts/rebrand-engine-locales.ps1',
            'scripts/rewrite-engine-product-links.ps1',
            'scripts/rewrite-engine-default-search.ps1',
            'scripts/rewrite-engine-windows-identity.ps1',
            'scripts/rewrite-engine-windows-executable.ps1',
            'scripts/rewrite-engine-product-version.ps1',
            'scripts/rewrite-engine-version-updater.ps1',
            'scripts/harden-engine-version-updater.ps1',
            'scripts/verify-engine-version-updater.ps1',
            'scripts/rewrite-engine-internal-scheme.ps1',
            'scripts/verify-engine-locales.ps1',
            'scripts/verify-engine-fork.ps1',
            'scripts/verify-engine-windows-executable.ps1',
            'scripts/configure-engine-build.ps1',
            'scripts/verify-engine-build-output.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }
          python3 -m py_compile scripts/generate-engine-brand-assets.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Brand asset generator has Python syntax errors.'
          }

      - name: Validate pinned revisions and Windows source-build contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($revisionFile in @('ENGINE_SOURCE_REVISION')) {
            $value = (Get-Content $revisionFile -Raw).Trim()
            if ($value -notmatch '^[0-9a-f]{40}$') {
              throw "$revisionFile must contain one exact 40-character Git commit."
            }
          }

          $argsPath = 'engine/build/windows-x64.args.gn'
          if (!(Test-Path $argsPath -PathType Leaf)) {
            throw "Missing deterministic Windows GN args: $argsPath"
          }
          $args = Get-Content $argsPath -Raw
          foreach ($required in @(
            'is_debug = false',
            'is_component_build = false',
            'is_official_build = false',
            'is_chrome_branded = false',
            'target_cpu = "x64"',
            'use_remoteexec = false'
          )) {
            if (!$args.Contains($required)) {
              throw "Windows source-build args are missing required invariant: $required"
            }
          }
          foreach ($forbidden in @(
            '(?im)^\s*is_chrome_branded\s*=\s*true\s*$',
            '(?im)^\s*is_official_build\s*=\s*true\s*$',
            '(?im)^\s*use_remoteexec\s*=\s*true\s*$',
            '(?im)^\s*google_api_key\s*=',
            '(?im)^\s*google_default_client_id\s*=',
            '(?im)^\s*google_default_client_secret\s*='
          )) {
            if ($args -match $forbidden) {
              throw "Windows source-build args contain forbidden active configuration: $forbidden"
            }
          }

          $workflow = Get-Content '.github/workflows/full-source-windows-build.yml' -Raw
          foreach ($required in @(
            'workflow_dispatch:',
            'ghosium-source-builder',
            'bootstrap-engine-source.ps1',
            'apply-engine-branding.ps1',
            'configure-engine-build.ps1',
            'autoninja -C out/Ghosium chrome mini_installer',
            'verify-engine-build-output.ps1',
            'build-source-release-installer.ps1',
            'GHOSIUM-CANONICAL-SETUP-SMOKE.json'
          )) {
            if (!$workflow.Contains($required)) {
              throw "Full-source Windows workflow is missing required stage: $required"
            }
          }
          if ($workflow -match '(?m)^\s*pull_request\s*:' -or $workflow -match '(?m)^\s*push\s*:') {
            throw 'Heavy full-source Windows build must remain explicit manual/self-hosted workflow.'
          }

      - name: Validate deterministic brand assets and product configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetRoot = Join-Path $env:RUNNER_TEMP 'ghosium-brand-assets'
          python3 scripts/generate-engine-brand-assets.py $assetRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Ghosium deterministic brand asset generation failed.'
          }
          foreach ($relative in @(
            'chrome/app/theme/default_100_percent/chromium/product_logo_32.png',
            'chrome/app/theme/chromium/win/chromium.ico'
          )) {
            $path = Join-Path $assetRoot $relative
            if (!(Test-Path $path -PathType Leaf) -or (Get-Item $path).Length -le 100) {
              throw "Generated Ghosium brand asset is missing or empty: $relative"
            }
          }

          $config = Get-Content 'engine/branding/product.json' -Raw | ConvertFrom-Json
          if ([string]$config.internalUi.scheme -ne 'ghost' -or
              [string]$config.internalUi.untrustedScheme -ne 'ghost-untrusted') {
            throw 'Ghosium internal UI schemes must be ghost / ghost-untrusted.'
          }
          foreach ($route in @(
            'ghost://newtab/',
            'ghost://history/',
            'ghost://bookmarks/',
            'ghost://downloads/',
            'ghost://settings/',
            'ghost://profiles/',
            'ghost://extensions/',
            'ghost://passwords/'
          )) {
            if (@($config.internalUi.routes) -notcontains $route) {
              throw "Missing Ghosium internal route: $route"
            }
          }

  pinned-source-smoke:
    name: Apply branding to pinned upstream source
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Ghosium fork tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Sparse checkout pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/ghosium-engine-src"
          revision="$(tr -d '\r\n ' < ENGINE_SOURCE_REVISION)"

          git init "$src"
          git -C "$src" remote add origin https://github.com/chromium/chromium.git
          git -C "$src" config core.sparseCheckout true
          mkdir -p "$src/.git/info"
          cat > "$src/.git/info/sparse-checkout" <<'EOF'
          /build/win/reorder-imports.py
          /chrome/BUILD.gn
          /chrome/app/chrome_exe.ver
          /chrome/app/chromium_strings.grd
          /chrome/app/settings_chromium_strings.grdp
          /chrome/app/resources/
          /chrome/app/theme/chromium/
          /chrome/chrome_proxy/BUILD.gn
          /chrome/chrome_proxy/chrome_proxy.ver
          /chrome/chrome_proxy/chrome_proxy_main_win.cc
          /chrome/common/url_constants.h
          /chrome/common/webui_url_constants.h
          /chrome/install_static/chromium_install_modes.h
          /chrome/installer/launcher_support/chrome_launcher_support.cc
          /chrome/installer/mini_installer/BUILD.gn
          /chrome/installer/mini_installer/chrome.release
          /chrome/installer/setup/setup_constants.cc
          /chrome/installer/setup/setup_main.cc
          /chrome/installer/setup/uninstall.cc
          /chrome/installer/setup/install_worker.cc
          /chrome/installer/util/util_constants.h
          /chrome/browser/browser_about_handler.cc
          /chrome/browser/ui/chrome_pages.cc
          /chrome/browser/ui/webui/version/version_ui.cc
          /chrome/browser/ui/webui/help/BUILD.gn
          /chrome/browser/ui/webui/help/version_updater_basic.cc
          /chrome/browser/ui/webui/side_panel/customize_chrome/customize_chrome_page_handler.cc
          /chrome/browser/ui/webui/extensions/extensions_ui.cc
          /chrome/browser/resources/settings/about_page/about_page.ts
          /chrome/browser/resources/signin/managed_user_profile_notice/managed_user_profile_notice_value_prop.html.ts
          /chrome/browser/resources/contextual_tasks/top_toolbar_logo.html.ts
          /components/components_chromium_strings.grd
          /components/search_engines/template_url_prepopulate_data.cc
          /components/strings/
          /components/vector_icons/chromium/
          /content/public/common/url_constants.h
          /extensions/strings/
          /ui/webui/resources/images/chrome_logo_dark.svg
          EOF

          git -C "$src" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$revision"
          echo "ENGINE_SRC=$src" >> "$GITHUB_ENV"

      - name: Apply complete Ghosium source transform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/apply-engine-branding.ps1 -SourceRoot $env:ENGINE_SRC
          ./scripts/verify-engine-fork.ps1 -SourceRoot $env:ENGINE_SRC
          ./scripts/verify-engine-windows-executable.ps1 -SourceRoot $env:ENGINE_SRC
          ./scripts/verify-engine-version-updater.ps1 -SourceRoot $env:ENGINE_SRC

      - name: Validate Ghosium updater and public source identity
        shell: bash
        run: |
          set -euo pipefail
          src="$ENGINE_SRC"
          product_version="$(tr -d '\r\n ' < VERSION)"
          updater="$src/chrome/browser/ui/webui/help/version_updater_ghosium_win.cc"

          git -C "$src" diff --check
          test -f "$updater"
          grep -F 'https://updates.ghosium.com/windows/stable.json' "$updater"
          grep -F 'CredentialsMode::kOmit' "$updater"
          grep -F 'crypto::hash::HashFile' "$updater"
          grep -F 'base::win::IsBinaryTrusted' "$updater"
          grep -F 'true /* force_verify_in_dev_builds */' "$updater"
          grep -F 'AppendArgNative(L"/S")' "$updater"
          grep -F 'AppendArgNative(L"/UPDATE")' "$updater"
          grep -F 'AppendArgNative(L"/DELETESELF")' "$updater"

          grep -F 'Customize Ghosium' "$src/chrome/app/chromium_strings.grd"
          grep -F 'Ghosium Search' "$src/components/search_engines/template_url_prepopulate_data.cc"
          grep -F 'kCompanyPathName[] = L"Brendigo"' "$src/chrome/install_static/chromium_install_modes.h"
          grep -F 'kProductPathName[] = L"Ghosium"' "$src/chrome/install_static/chromium_install_modes.h"
          grep -F '$root_out_dir/Ghosium-Browser.exe' "$src/chrome/BUILD.gn"
          grep -F 'ORIGINAL_FILENAME=Ghosium-Browser.exe' "$src/chrome/app/chrome_exe.ver"
          grep -F 'Ghosium-Browser.exe: %(ChromeDir)s\' "$src/chrome/installer/mini_installer/chrome.release"
          grep -F 'Ghosium-Proxy.exe: %(ChromeDir)s\' "$src/chrome/installer/mini_installer/chrome.release"
          grep -F 'kChromeExe[] = L"Ghosium-Browser.exe"' "$src/chrome/installer/util/util_constants.h"
          grep -F 'kChromeProxyExe[] = L"Ghosium-Proxy.exe"' "$src/chrome/installer/util/util_constants.h"
          grep -F 'kChromeUIScheme[] = "ghost"' "$src/content/public/common/url_constants.h"
          grep -F 'kChromeUIUntrustedScheme[] = "ghost-untrusted"' "$src/content/public/common/url_constants.h"

          test -f "$src/chrome/common/ghosium_product_version.h"
          grep -F "kProductVersion[] = \"${product_version}\"" "$src/chrome/common/ghosium_product_version.h"

          if grep -Eqi '(^|[^A-Za-z])(powershell|cmd|curl)(\.exe)?|GoogleUpdate|google_update_win|(^|[^A-Za-z])(update|updater)\.exe' "$updater"; then
            echo 'Native Ghosium updater contains a forbidden shell, Google updater, or standalone updater dependency.' >&2
            exit 1
          fi
          if git -C "$src" status --porcelain=v1 -- third_party | grep -q .; then
            echo 'Ghosium source transform modified third_party source.' >&2
            exit 1
          fi

          git -C "$src" status --short
