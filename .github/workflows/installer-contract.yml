name: Ghosium Windows Installer Contract

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - ghosium.ico
      - installer/**
      - scripts/resolve-nsis.ps1
      - scripts/smoke-test-windows-installer.ps1
      - scripts/smoke-test-installer-contract-fixture.ps1
      - .github/workflows/installer-contract.yml
  pull_request:
    paths:
      - VERSION
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - ghosium.ico
      - installer/**
      - scripts/resolve-nsis.ps1
      - scripts/smoke-test-windows-installer.ps1
      - scripts/smoke-test-installer-contract-fixture.ps1
      - .github/workflows/installer-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghosium-installer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-contract:
    name: Compile and verify same-Setup lifecycle
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile Setup and Portable and verify lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/smoke-test-installer-contract-fixture.ps1
