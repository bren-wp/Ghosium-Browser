name: Ghosium GitHub Preview Windows Build

on:
  push:
    branches:
      - ghosium/github-preview/0.1.8

concurrency:
  group: ghosium-github-preview-0.1.8
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-preview-contract:
    name: Verify isolated 0.1.8 preview contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      preview_tag: ${{ steps.meta.outputs.preview_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate version Google Search and isolation
        id: meta
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version != '0.1.8':
              raise SystemExit(f'Preview branch must remain Ghosium 0.1.8; found {version!r}')

          manifest = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != version or manifest.get('manifest_version') != 3:
              raise SystemExit('Ghosium Privacy manifest/version contract failed.')

          stable = json.loads(Path('updates-web/windows/stable.json').read_text(encoding='utf-8'))
          if stable.get('version') != version or stable.get('enabled') is not False or stable.get('sha256') or stable.get('size') != 0:
              raise SystemExit('Stable updater must remain version-synchronized and fail-closed for Preview.')

          newtab = Path('extension/newtab.html').read_text(encoding='utf-8')
          if 'action="https://www.google.com/search"' not in newtab or 'name="q"' not in newtab:
              raise SystemExit('Preview New Tab must submit directly to Google Search.')

          for retired in ('search-provider', 'search-web'):
              if Path(retired).exists():
                  raise SystemExit(f'Retired first-party Search stack returned: {retired}')

          for required in (
              'compat-preview/launcher/main.cpp',
              'compat-preview/launcher/ghosium.rc',
              'scripts/generate-engine-brand-assets.py',
              'scripts/smoke-test-windows-installer.ps1',
              'installer/ghosium.nsi',
              'ENGINE_REVISION',
              'LICENSE',
              'THIRD_PARTY_NOTICES.md',
          ):
              if not Path(required).is_file():
                  raise SystemExit(f'Missing preview input: {required}')

          engine_revision = Path('ENGINE_REVISION').read_text(encoding='utf-8').strip()
          if not engine_revision.isdigit():
              raise SystemExit(f'ENGINE_REVISION must remain numeric for snapshot Preview: {engine_revision!r}')

          tag = f'ghosium-v{version}-preview.1'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'version={version}\n')
              out.write(f'preview_tag={tag}\n')
          print(f'Ghosium Preview contract OK: {version} / {tag} / engine {engine_revision}')

  build-windows-preview:
    name: Build and smoke-test Ghosium 0.1.8 Preview Setup
    needs: verify-preview-contract
    runs-on: windows-2025
    timeout-minutes: 80
    env:
      GHOSIUM_VERSION: ${{ needs.verify-preview-contract.outputs.version }}
      LEGACY_BUILD_COMMIT: b5346e604a24081cd50f5484e539f9f1e34754d8

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Materialize pinned preview compiler support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'launcher', 'compat-preview/vendor', 'downloads', 'staging/runtime', 'artifacts/preview' | Out-Null
          Copy-Item 'compat-preview/launcher/main.cpp' 'launcher/main.cpp' -Force
          Copy-Item 'compat-preview/launcher/ghosium.rc' 'launcher/ghosium.rc' -Force

          $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:LEGACY_BUILD_COMMIT"
          foreach ($entry in @(
            @('scripts/build-native-launcher.ps1', 'compat-preview/vendor/build-native-launcher.ps1'),
            @('scripts/resolve-nsis.ps1', 'compat-preview/vendor/resolve-nsis.ps1')
          )) {
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors "$raw/$($entry[0])" --output $entry[1]
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $entry[1] -PathType Leaf)) {
              throw "Unable to materialize pinned preview build support: $($entry[0])"
            }
          }

      - name: Download verified pinned Chromium snapshot
        id: engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (Get-Content 'ENGINE_REVISION' -Raw).Trim()
          $base = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$revision"
          $archive = 'downloads/engine-win.zip'
          curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors "$base/chrome-win.zip" --output $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $archive -PathType Leaf)) {
            throw 'Pinned Chromium snapshot download failed.'
          }
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -Path $archive -DestinationPath 'downloads/engine' -Force
          $sourceDirectory = 'downloads/engine/chrome-win'
          if (!(Test-Path "$sourceDirectory/chrome.exe" -PathType Leaf)) {
            throw 'Pinned Chromium snapshot is incomplete.'
          }
          Copy-Item "$sourceDirectory/*" 'staging/runtime' -Recurse -Force
          Move-Item 'staging/runtime/chrome.exe' 'staging/runtime/Ghosium-Engine.exe' -Force
          if (Test-Path 'staging/runtime/chrome_proxy.exe' -PathType Leaf) {
            Move-Item 'staging/runtime/chrome_proxy.exe' 'staging/runtime/Ghosium-Proxy.exe' -Force
          }

          $engineVersion = (Get-Item 'staging/runtime/Ghosium-Engine.exe').VersionInfo.ProductVersion.Trim()
          $effectiveUrl = (& curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors --output NUL --write-out '%{url_effective}' "https://crrev.com/$revision").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve snapshot source revision.' }
          $sourceMatch = [regex]::Match($effectiveUrl, '/\+/([0-9a-f]{40})(?:/|$)')
          if (!$sourceMatch.Success) { throw "Unexpected source revision response: $effectiveUrl" }
          $sourceRevision = $sourceMatch.Groups[1].Value

          curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors "https://chromium.googlesource.com/chromium/src/+/$sourceRevision/LICENSE?format=TEXT" --output 'downloads/upstream-license.b64'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download pinned upstream license.' }
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD 'staging/UPSTREAM-LICENSE.txt'),
            [Convert]::FromBase64String((Get-Content 'downloads/upstream-license.b64' -Raw).Trim())
          )

          "revision=$revision" >> $env:GITHUB_OUTPUT
          "engine_version=$engineVersion" >> $env:GITHUB_OUTPUT
          "source_revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "archive_sha256=$archiveHash" >> $env:GITHUB_OUTPUT

      - name: Assemble current Google-only Ghosium surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'extension' 'staging/extension' -Recurse -Force
          Copy-Item 'LICENSE', 'PRIVACY.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md' 'staging' -Force

          if (Test-Path 'staging/search-provider' -PathType Container) {
            throw 'Retired Ghosium Search provider must not be packaged.'
          }
          $manifest = Get-Content 'staging/extension/manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:GHOSIUM_VERSION) {
            throw 'Staged Ghosium Privacy version mismatch.'
          }
          $newtab = Get-Content 'staging/extension/newtab.html' -Raw
          if (!$newtab.Contains('action="https://www.google.com/search"')) {
            throw 'Staged New Tab does not use Google Search.'
          }

      - name: Compile optimized Brendigo Ghosium launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./compat-preview/vendor/build-native-launcher.ps1 -Version $env:GHOSIUM_VERSION -OutputPath 'staging/Ghosium-Browser.exe'
          if (!(Test-Path 'staging/Ghosium-Browser.exe' -PathType Leaf)) {
            throw 'Ghosium preview launcher was not produced.'
          }

      - name: Smoke test launcher and engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $selfTest = Start-Process -FilePath (Resolve-Path 'staging/Ghosium-Browser.exe') -ArgumentList '--ghosium-self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Launcher self-test failed: $($selfTest.ExitCode)" }

          $profile = Join-Path $env:RUNNER_TEMP 'ghosium-preview-runtime'
          $stdout = Join-Path $env:RUNNER_TEMP 'ghosium-preview.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ghosium-preview.stderr.txt'
          $args = @('--headless=new','--disable-gpu','--disable-sync','--no-pings','--no-first-run',"--user-data-dir=$profile",'--dump-dom','data:text/html,<html><body>ghosium-preview-runtime-ok</body></html>')
          $process = Start-Process -FilePath (Resolve-Path 'staging/runtime/Ghosium-Engine.exe') -ArgumentList $args -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          if ($process.ExitCode -ne 0 -or !$output.Contains('ghosium-preview-runtime-ok')) {
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            throw "Pinned engine runtime smoke failed: $($process.ExitCode)"
          }
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build current 38-locale Preview Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolverOutput = @(& ./compat-preview/vendor/resolve-nsis.ps1)
          if ($resolverOutput.Count -eq 0) { throw 'NSIS resolver returned no compiler path.' }
          $makensis = [string]$resolverOutput[-1]
          if (!(Test-Path $makensis -PathType Leaf)) { throw "Invalid makensis path: $makensis" }

          $stage = (Resolve-Path 'staging').Path
          $artifacts = (Resolve-Path 'artifacts/preview').Path
          $icon = (Resolve-Path 'ghosium.ico').Path
          & $makensis "/DGHOSIUM_VERSION=$env:GHOSIUM_VERSION" "/DGHOSIUM_STAGE=$stage" "/DGHOSIUM_ARTIFACTS=$artifacts" "/DGHOSIUM_ICON=$icon" 'installer/ghosium.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Ghosium Preview Setup NSIS build failed.' }

          $setup = Get-Item 'artifacts/preview/Ghosium-Browser-Setup.exe'
          if ($setup.Length -lt 50MB) { throw 'Preview Setup is unexpectedly small.' }
          $info = $setup.VersionInfo
          if ([string]$info.ProductName -ne 'Ghosium Browser' -or [string]$info.CompanyName -ne 'Brendigo' -or [string]$info.ProductVersion -notlike "$env:GHOSIUM_VERSION*") {
            throw "Preview Setup metadata mismatch: $($info.ProductName) / $($info.CompanyName) / $($info.ProductVersion)"
          }

      - name: Install update runtime and uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/smoke-test-windows-installer.ps1 `
            -SetupPath 'artifacts/preview/Ghosium-Browser-Setup.exe' `
            -Version $env:GHOSIUM_VERSION `
            -ReportPath 'artifacts/preview/GHOSIUM-PREVIEW-SETUP-SMOKE.json'

      - name: Generate provenance and SHA-256 evidence
        shell: pwsh
        env:
          ENGINE_REVISION: ${{ steps.engine.outputs.revision }}
          ENGINE_VERSION: ${{ steps.engine.outputs.engine_version }}
          ENGINE_SOURCE_REVISION: ${{ steps.engine.outputs.source_revision }}
          ENGINE_ARCHIVE_SHA256: ${{ steps.engine.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item 'artifacts/preview/Ghosium-Browser-Setup.exe'
          $setupHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $smoke = Get-Content 'artifacts/preview/GHOSIUM-PREVIEW-SETUP-SMOKE.json' -Raw | ConvertFrom-Json
          if (!$smoke.installCompleted -or !$smoke.updateCompleted -or !$smoke.runtimeBeforeUpdate -or !$smoke.runtimeAfterUpdate -or !$smoke.uninstallCompleted) {
            throw 'Preview Setup smoke evidence is incomplete.'
          }

          [ordered]@{
            schemaVersion = 2
            product = 'Ghosium Browser'
            productVersion = $env:GHOSIUM_VERSION
            releaseKind = 'github-snapshot-preview'
            fullSourceBuild = $false
            productionStable = $false
            stableUpdaterEnabled = $false
            defaultSearch = 'Google Search'
            retiredFirstPartySearchPackaged = $false
            repositoryCommit = $env:GITHUB_SHA
            repositoryRef = $env:GITHUB_REF
            architecture = 'windows-x64'
            engine = [ordered]@{
              snapshotRevision = $env:ENGINE_REVISION
              productVersion = $env:ENGINE_VERSION
              sourceRevision = $env:ENGINE_SOURCE_REVISION
              archiveSha256 = $env:ENGINE_ARCHIVE_SHA256
            }
            setup = [ordered]@{
              name = $setup.Name
              bytes = $setup.Length
              sha256 = $setupHash
            }
            smokeEvidence = 'GHOSIUM-PREVIEW-SETUP-SMOKE.json'
            notice = 'GitHub-hosted pinned-snapshot Preview. Not the canonical full-source production release.'
          } | ConvertTo-Json -Depth 6 | Set-Content 'artifacts/preview/GHOSIUM-PREVIEW-BUILD.json' -Encoding utf8

          @(
            "$setupHash  $($setup.Name)",
            "$( (Get-FileHash 'artifacts/preview/GHOSIUM-PREVIEW-BUILD.json' -Algorithm SHA256).Hash.ToLowerInvariant() )  GHOSIUM-PREVIEW-BUILD.json",
            "$( (Get-FileHash 'artifacts/preview/GHOSIUM-PREVIEW-SETUP-SMOKE.json' -Algorithm SHA256).Hash.ToLowerInvariant() )  GHOSIUM-PREVIEW-SETUP-SMOKE.json"
          ) | Set-Content 'artifacts/preview/SHA256SUMS.txt' -Encoding ascii

          @(
            "Ghosium Browser $env:GHOSIUM_VERSION Preview 1",
            'Default search: Google Search',
            'First-party Ghosium Search stack packaged: NO',
            'Build kind: GitHub-hosted pinned Chromium snapshot + optimized Ghosium C++ launcher',
            'Canonical full-source production release: NO',
            'Stable updater enabled: NO',
            "Repository commit: $env:GITHUB_SHA",
            "Engine snapshot revision: $env:ENGINE_REVISION",
            "Engine source revision: $env:ENGINE_SOURCE_REVISION"
          ) | Set-Content 'artifacts/preview/BUILD-STATUS.txt' -Encoding utf8

      - name: Upload verified Preview bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghosium-github-preview-windows-x64-${{ env.GHOSIUM_VERSION }}
          path: artifacts/preview/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-preview:
    name: Publish Ghosium 0.1.8 Preview 1
    needs:
      - verify-preview-contract
      - build-windows-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified Preview bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ghosium-github-preview-windows-x64-${{ needs.verify-preview-contract.outputs.version }}
          path: artifacts

      - name: Validate exact Preview provenance
        shell: python
        env:
          GHOSIUM_VERSION: ${{ needs.verify-preview-contract.outputs.version }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path('artifacts/GHOSIUM-PREVIEW-BUILD.json').read_text(encoding='utf-8-sig'))
          if evidence.get('productVersion') != os.environ['GHOSIUM_VERSION']:
              raise SystemExit('Preview version mismatch.')
          if evidence.get('releaseKind') != 'github-snapshot-preview' or evidence.get('fullSourceBuild') is not False or evidence.get('productionStable') is not False:
              raise SystemExit('Preview provenance makes an invalid production/full-source claim.')
          if evidence.get('stableUpdaterEnabled') is not False or evidence.get('defaultSearch') != 'Google Search' or evidence.get('retiredFirstPartySearchPackaged') is not False:
              raise SystemExit('Preview search/update provenance mismatch.')

          setup = Path('artifacts/Ghosium-Browser-Setup.exe')
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          if digest != evidence['setup']['sha256'] or setup.stat().st_size != evidence['setup']['bytes']:
              raise SystemExit('Setup does not match preview provenance.')
          for name in ('GHOSIUM-PREVIEW-SETUP-SMOKE.json', 'SHA256SUMS.txt', 'BUILD-STATUS.txt'):
              if not Path('artifacts', name).is_file():
                  raise SystemExit(f'Missing preview evidence: {name}')

      - name: Publish immutable Preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.verify-preview-contract.outputs.preview_tag }}
          GHOSIUM_VERSION: ${{ needs.verify-preview-contract.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview release $PREVIEW_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$PREVIEW_TAG" \
            artifacts/Ghosium-Browser-Setup.exe \
            artifacts/GHOSIUM-PREVIEW-BUILD.json \
            artifacts/GHOSIUM-PREVIEW-SETUP-SMOKE.json \
            artifacts/SHA256SUMS.txt \
            artifacts/BUILD-STATUS.txt \
            --target "$GITHUB_SHA" \
            --title "Ghosium Browser $GHOSIUM_VERSION Preview 1" \
            --notes $'GitHub-hosted Windows x64 Preview for Ghosium Browser 0.1.8.\n\nThis build uses Google Search directly from the current Ghosium New Tab surface. The retired first-party Ghosium Search provider/web stack is not bundled. The Setup uses the current 38-locale installer and has passed install -> runtime -> same-Setup update -> runtime -> uninstall verification on GitHub Actions.\n\nThis prerelease uses the repository-pinned official Chromium Windows snapshot plus an optimized Brendigo Ghosium launcher. It is intentionally not represented as the canonical full-source production release, does not enable the stable updater, and does not replace the controlled full-source release gate. Provenance, Setup smoke evidence and SHA-256 checksums are attached.' \
            --prerelease \
            --repo "$GITHUB_REPOSITORY"
