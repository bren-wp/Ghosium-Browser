name: Ghosium Performance Baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'scripts/benchmark-ghosium-windows.ps1'
      - '.github/workflows/performance-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-v0-8-0:
    name: Benchmark pre-0.1.0 public baseline
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout benchmark harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable historical Windows build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactId = 10001906995
          $workflowRunId = 34075200979
          $expectedArtifactName = 'Ghosium-Browser-Windows-x64'
          $expectedArtifactDigest = 'sha256:5210f478454717728fac93c5f2fa176beffefc13a151f74be74c7c7800972c71'

          $metadataJson = gh api "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read historical Windows build artifact metadata.'
          }
          $artifact = $metadataJson | ConvertFrom-Json
          if ([bool]$artifact.expired) {
            throw 'Historical Windows build artifact has expired; refusing to substitute an unverified baseline binary.'
          }
          if ([string]$artifact.name -ne $expectedArtifactName) {
            throw "Historical artifact name mismatch: $($artifact.name)"
          }
          if ([int64]$artifact.workflow_run.id -ne $workflowRunId) {
            throw "Historical artifact workflow-run mismatch: $($artifact.workflow_run.id)"
          }
          if ([string]$artifact.digest -ne $expectedArtifactDigest) {
            throw "Historical artifact digest mismatch: $($artifact.digest)"
          }
          Write-Host "Verified retained historical artifact $artifactId from run $workflowRunId."

      - name: Download immutable historical Windows build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: '10001906995'
          path: baseline-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34075200979'

      - name: Resolve and verify historical baseline Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path baseline, artifacts | Out-Null
          $matches = @(Get-ChildItem 'baseline-package' -Recurse -File -Filter 'Ghosium-Browser-Setup.exe')
          if ($matches.Count -ne 1) {
            throw "Expected exactly one historical Ghosium-Browser-Setup.exe; found $($matches.Count)."
          }
          Copy-Item $matches[0].FullName 'baseline/Ghosium-Browser-Setup.exe' -Force
          $hash = (Get-FileHash 'baseline/Ghosium-Browser-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '45815ec06c1e63954a29793cac756d6f91af44edaff569159c23fb9f1b8e6e50') {
            throw "Historical baseline Setup hash mismatch: $hash"
          }
          Write-Host "Verified historical baseline Setup SHA-256: $hash"

      - name: Install historical baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'baseline/Ghosium-Browser-Setup.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Historical baseline installation failed with exit code $($process.ExitCode)"
          }
          $browser = Join-Path $env:LOCALAPPDATA 'Programs\Ghosium Browser\Ghosium-Browser.exe'
          if (!(Test-Path $browser -PathType Leaf)) {
            throw "Historical baseline browser executable was not installed: $browser"
          }

      - name: Measure cold/warm startup, RAM, CPU, processes and I/O
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $browser = Join-Path $env:LOCALAPPDATA 'Programs\Ghosium Browser\Ghosium-Browser.exe'
          ./scripts/benchmark-ghosium-windows.ps1 `
            -BrowserPath $browser `
            -OutputPath 'artifacts/PERFORMANCE-BASELINE-v0.8.0.json' `
            -IdleSeconds 60 `
            -StartupTimeoutSeconds 30

      - name: Uninstall historical baseline
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.ProcessName -in @('Ghosium-Browser', 'Ghosium-Engine')
          } | Stop-Process -Force -ErrorAction SilentlyContinue

          $installedSetup = Join-Path $env:LOCALAPPDATA 'Programs\Ghosium Browser\Installer\Ghosium-Browser-Setup.exe'
          if (Test-Path $installedSetup -PathType Leaf) {
            $process = Start-Process -FilePath $installedSetup -ArgumentList '/S', '/UNINSTALL' -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Write-Warning "Baseline uninstall returned exit code $($process.ExitCode)"
            }
          }

      - name: Upload baseline benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghosium-performance-baseline-v0.8.0
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
