name: Ghosium 0.1.9 README Screenshots

on:
  push:
    branches:
      - ghosium/release/0.1.9
    paths:
      - .release/ghosium-v0.1.9.readme-screenshots

permissions:
  contents: write

concurrency:
  group: ghosium-0.1.9-readme-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render real Ghosium 0.1.9 surfaces and update README
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ghosium/release/0.1.9
          fetch-depth: 1
          persist-credentials: true

      - name: Validate screenshot contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content VERSION -Raw).Trim() -ne '0.1.9') { throw 'README screenshot workflow must run only for Ghosium 0.1.9.' }
          $manifest = Get-Content extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.1.9' -or $manifest.name -ne 'Ghosium Privacy') { throw 'Ghosium 0.1.9 extension identity mismatch.' }
          foreach ($path in @('extension/newtab.html','extension/options.html','extension/popup.html','engine/branding/ghosium-mark.svg')) {
            if (!(Test-Path $path -PathType Leaf)) { throw "Missing screenshot source: $path" }
          }

      - name: Download pinned Windows preview engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (Get-Content ENGINE_REVISION -Raw).Trim()
          if ($revision -notmatch '^\d+$') { throw "Invalid ENGINE_REVISION: $revision" }
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          $archive = 'downloads/engine-win.zip'
          $url = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$revision/chrome-win.zip"
          curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors $url --output $archive
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $archive -PathType Leaf)) { throw 'Pinned Chromium screenshot engine download failed.' }
          Expand-Archive $archive downloads/engine -Force
          if (!(Test-Path 'downloads/engine/chrome-win/chrome.exe' -PathType Leaf)) { throw 'Pinned screenshot engine is incomplete.' }

      - name: Render Ghosium New Tab Options and Privacy surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chrome = (Resolve-Path 'downloads/engine/chrome-win/chrome.exe').Path
          $extension = (Resolve-Path 'extension').Path
          $profile = Join-Path $env:RUNNER_TEMP 'ghosium-readme-profile'
          $images = Join-Path $PWD 'docs/images'
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $images | Out-Null

          $common = @(
            '--headless=new',
            '--disable-gpu',
            '--no-first-run',
            '--no-default-browser-check',
            '--disable-background-networking',
            '--disable-sync',
            '--disable-component-update',
            '--metrics-recording-only',
            '--window-size=1440,900',
            "--user-data-dir=$profile",
            "--disable-extensions-except=$extension",
            "--load-extension=$extension"
          )

          function Assert-GhosiumPage([string]$Url, [string]$Output, [string]$Needle) {
            $domPath = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($Output) + '.html')
            & $chrome @common '--dump-dom' $Url 1> $domPath 2>$null
            if ($LASTEXITCODE -ne 0) { throw "DOM render failed for $Url" }
            $dom = Get-Content $domPath -Raw
            if (!$dom.Contains($Needle)) { throw "Rendered page is not the expected Ghosium surface: $Url" }
            & $chrome @common "--screenshot=$Output" $Url | Out-Null
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $Output -PathType Leaf) -or (Get-Item $Output).Length -lt 10000) {
              throw "Screenshot generation failed or produced an invalid image: $Output"
            }
          }

          $newTabShot = Join-Path $images 'ghosium-new-tab.png'
          Assert-GhosiumPage 'chrome://newtab/' $newTabShot 'Ghosium'

          $preferences = Join-Path $profile 'Default/Preferences'
          if (!(Test-Path $preferences -PathType Leaf)) { throw 'Chromium profile preferences were not created; cannot resolve the loaded Ghosium extension id.' }
          $prefs = Get-Content $preferences -Raw | ConvertFrom-Json
          $extensionId = $null
          foreach ($property in $prefs.extensions.settings.PSObject.Properties) {
            $entry = $property.Value
            if ($entry.manifest -and [string]$entry.manifest.name -eq 'Ghosium Privacy') {
              $extensionId = [string]$property.Name
              break
            }
          }
          if (!$extensionId -or $extensionId -notmatch '^[a-p]{32}$') { throw "Unable to resolve deterministic runtime extension id: '$extensionId'" }

          Assert-GhosiumPage "chrome-extension://$extensionId/options.html" (Join-Path $images 'ghosium-options.png') 'Customize Ghosium'
          Assert-GhosiumPage "chrome-extension://$extensionId/popup.html" (Join-Path $images 'ghosium-privacy.png') 'Ghosium Privacy'

          $provenance = [ordered]@{
            schemaVersion = 1
            product = 'Ghosium Browser'
            productVersion = '0.1.9'
            repositoryCommit = $env:GITHUB_SHA
            engineSnapshotRevision = (Get-Content ENGINE_REVISION -Raw).Trim()
            renderer = 'pinned Chromium Windows x64 snapshot'
            surfaces = @('extension/newtab.html','extension/options.html','extension/popup.html')
            fullSourceBrowserShellScreenshot = $false
            note = 'These images are actual rendered Ghosium-owned surfaces. They do not claim to show the canonical full-source native browser chrome.'
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $images 'GHOSIUM-SCREENSHOTS.json') -Encoding utf8

      - name: Update README for 0.1.9 and real screenshots
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('# Ghosium Browser\n\n', '<p align="center">\n  <img src="engine/branding/ghosium-mark.svg" width="112" alt="Ghosium Browser icon">\n</p>\n\n# Ghosium Browser\n\n', 1)
          text = text.replace('The current development version is **0.1.8**.', 'The current development version is **0.1.9**.')
          text = text.replace('ghosium-v0.1.8\nghosium-v0.2.0', 'ghosium-v0.1.8\nghosium-v0.1.9\nghosium-v0.2.0')
          text = text.replace('**0.1.8 must not be described as a released source-built binary', '**0.1.9 must not be described as a released source-built binary')
          text = text.replace('Ghosium 0.1.8 defines **38 supported product locales**.', 'Ghosium 0.1.9 defines **38 supported product locales**.')
          text = text.replace('No numerical 0.1.8 performance claim is valid', 'No numerical 0.1.9 performance claim is valid')
          text = text.replace('Ghosium-Browser-Setup.exe\n```', 'Ghosium-Browser-Setup.exe\nGhosium-Browser-Portable.exe\n```', 1)
          text = text.replace('`Ghosium-Browser-Setup.exe` is the canonical maintenance package for normal install, `/S /UPDATE` and `/S /UNINSTALL`. Ghosium does not intentionally distribute a separate public updater or uninstaller executable.', '`Ghosium-Browser-Setup.exe` is the canonical maintenance package for normal install, `/S /UPDATE` and `/S /UNINSTALL`. `Ghosium-Browser-Portable.exe` is the registry-free portable package and keeps its profile beside the portable runtime. Ghosium does not intentionally distribute a separate public updater or uninstaller executable.')
          text = text.replace('`scripts/build-source-release-installer.ps1` — canonical Setup packaging/signing;', '`scripts/build-source-release-installer.ps1` — canonical Setup + Portable packaging/signing;')
          text = text.replace('Browser, proxy and Setup publisher relationships must validate', 'Browser, proxy, Setup and Portable publisher relationships must validate')
          text = text.replace('the end-user Windows product is the canonical Ghosium Setup package.', 'the end-user Windows packages are the canonical Ghosium Setup and Portable executables.')
          text = text.replace('Retired wrapper-launcher and legacy Portable packaging are intentionally not part of the current source-built architecture.', 'The retired wrapper-launcher stable-release path remains excluded. The current Portable package is generated from the same verified Ghosium source stage as Setup and does not restore the retired legacy stable-release architecture.')

          marker = '## Product contract\n'
          if '## Actual Ghosium interface' not in text:
              section = '''## Actual Ghosium interface\n\nThe images below are generated by GitHub Actions from the checked-in **0.1.9** Ghosium UI running in the pinned Windows preview engine. They are real rendered Ghosium-owned surfaces, not design mockups. They intentionally do **not** claim to show the canonical full-source native browser chrome until the controlled full-source build produces that evidence.\n\n### New Tab\n\n<p align="center">\n  <img src="docs/images/ghosium-new-tab.png" alt="Ghosium Browser 0.1.9 New Tab" width="100%">\n</p>\n\n### Customize Ghosium\n\n<p align="center">\n  <img src="docs/images/ghosium-options.png" alt="Ghosium Browser 0.1.9 customization options" width="100%">\n</p>\n\n### Ghosium Privacy\n\n<p align="center">\n  <img src="docs/images/ghosium-privacy.png" alt="Ghosium Privacy 0.1.9" width="720">\n</p>\n\nScreenshot provenance is recorded in `docs/images/GHOSIUM-SCREENSHOTS.json`.\n\n'''
              text = text.replace(marker, section + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit verified README screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/images/ghosium-new-tab.png docs/images/ghosium-options.png docs/images/ghosium-privacy.png docs/images/GHOSIUM-SCREENSHOTS.json
          if ([string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'README screenshot workflow produced no tracked changes.' }
          git commit -m 'docs: add real Ghosium 0.1.9 interface screenshots'
          git push origin HEAD:ghosium/release/0.1.9
