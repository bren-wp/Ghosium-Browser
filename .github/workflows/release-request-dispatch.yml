name: Ghosium Release Candidate Request

on:
  push:
    branches:
      - 'ghosium/release/**'
    paths:
      - '.release/*.request'

permissions:
  actions: write
  contents: read

concurrency:
  group: ghosium-full-source-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch-full-source:
    name: Dispatch controlled full-source Windows candidate build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate version-bound release request
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ ! "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Ghosium VERSION: $version" >&2
            exit 1
          fi
          tag="ghosium-v${version}"
          marker=".release/${tag}.request"
          test -f "$marker"
          test "$(tr -d '\r\n ' < "$marker")" = "$tag"
          shopt -s nullglob
          markers=(.release/ghosium-v*.request)
          if (( ${#markers[@]} != 1 )); then
            echo "Exactly one active Ghosium release request marker is required; found ${#markers[@]}." >&2
            exit 1
          fi
          if [[ "${markers[0]}" != "$marker" ]]; then
            echo "Active release marker does not match VERSION $version: ${markers[0]}" >&2
            exit 1
          fi
          expected_ref="refs/heads/ghosium/release/${version}"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Refusing release request from $GITHUB_REF; expected $expected_ref." >&2
            exit 1
          fi

      - name: Refuse an already published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          tag="ghosium-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Dispatch guarded full-source candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-source-windows-build.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
          echo "Dispatched controlled Ghosium full-source candidate workflow for ${GITHUB_REF_NAME}."
