name: Ghosium 0.1.9 Documentation Sync

on:
  push:
    branches:
      - ghosium/release/0.1.9
    paths:
      - .release/ghosium-v0.1.9.docs-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ghosium/release/0.1.9
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize 0.1.9 documentation
        shell: python
        run: |
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version != '0.1.9':
              raise SystemExit(f'Expected 0.1.9, got {version!r}')

          def replace_required(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, count)
              elif new not in text:
                  raise SystemExit(f'Missing documentation anchor in {path}: {old[:160]!r}')
              p.write_text(text, encoding='utf-8', newline='\n')

          # BUILDING.md: version synchronization plus canonical Setup + Portable release contract.
          replace_required('BUILDING.md', 'The active product version is `0.1.8`.', 'The active product version is `0.1.9`.')
          replace_required('BUILDING.md', 'Ghosium 0.1.8 supports 38 locales.', 'Ghosium 0.1.9 supports 38 locales.')
          replace_required('BUILDING.md', 'The 0.1.8 Windows source configuration includes:', 'The 0.1.9 Windows source configuration includes:')
          replace_required('BUILDING.md', 'compiled source-built 0.1.8 binary', 'compiled source-built 0.1.9 binary')
          replace_required(
              'BUILDING.md',
              'Ghosium-Browser-Setup.exe\n```',
              'Ghosium-Browser-Setup.exe\nGhosium-Browser-Portable.exe\n```',
          )
          replace_required(
              'BUILDING.md',
              '17. build `Ghosium-Browser-Setup.exe` from `installer/ghosium.nsi`;\n18. prove the public Setup is not a renamed technical installer;\n19. on production `main`, sign the Setup and verify the publisher relationship;\n20. run install → runtime → update → runtime → uninstall smoke verification;\n21. verify locale/profile preservation and cleanup behavior;\n22. generate the production update manifest for the exact signed Setup;\n23. generate provenance, performance and SHA-256 evidence;\n24. publish a new immutable `ghosium-v0.x.y` release only if the tag does not already exist.',
              '17. build `Ghosium-Browser-Setup.exe` and `Ghosium-Browser-Portable.exe` from the same verified source stage;\n18. prove the public Setup is not a renamed technical installer and validate the Portable registry-free/profile-isolation contract;\n19. on production `main`, sign both public packages and verify their publisher relationship to the signed browser;\n20. run install → runtime → update → runtime → uninstall smoke verification for Setup;\n21. verify locale/profile preservation, Portable profile isolation and cleanup behavior;\n22. generate the production update manifest for the exact signed Setup;\n23. generate provenance, performance and SHA-256 evidence including both public packages;\n24. publish a new immutable `ghosium-v0.x.y` release with Setup and Portable only if the tag does not already exist.',
          )
          replace_required(
              'BUILDING.md',
              '`Ghosium-Browser-Setup.exe` is the single public maintenance package and handles:',
              '`Ghosium-Browser-Setup.exe` is the single public maintenance package and handles:',
          )
          replace_required(
              'BUILDING.md',
              'No separately distributed updater or uninstaller executable is part of the Ghosium product.',
              'No separately distributed updater or uninstaller executable is part of the Ghosium product. `Ghosium-Browser-Portable.exe` is a separate registry-free end-user package; it is not an updater or uninstaller and keeps its profile/runtime data beside the Portable executable.',
          )
          replace_required(
              'BUILDING.md',
              'Browser, proxy and Setup signatures must validate and use the expected publisher relationship.',
              'Browser, proxy, Setup and Portable signatures must validate and use the expected publisher relationship.',
          )
          replace_required(
              'BUILDING.md',
              'GHOSIUM-PUBLIC-SETUP.json\nGHOSIUM-CANONICAL-SETUP-SMOKE.json',
              'GHOSIUM-PUBLIC-SETUP.json\nGhosium-Browser-Portable.exe\nGHOSIUM-CANONICAL-SETUP-SMOKE.json',
          )

          # docs/RELEASE.md: exact 0.1.9 scope and two-package production gate.
          replace_required('docs/RELEASE.md', 'The active development version is `0.1.8`.', 'The active development version is `0.1.9`.')
          replace_required('docs/RELEASE.md', 'ghosium-v0.1.8\nghosium-v0.2.0', 'ghosium-v0.1.8\nghosium-v0.1.9\nghosium-v0.2.0')
          replace_required(
              'docs/RELEASE.md',
              '## 0.1.8 release scope\n\nThe 0.1.8 line carries forward the Google Search simplification and adds repository/release hygiene enforcement:',
              '## 0.1.9 release scope\n\nThe 0.1.9 line carries forward the fail-closed Google Search/release contracts and adds Ghosium-owned UI, verified documentation imagery and a canonical Portable package:',
          )
          replace_required(
              'docs/RELEASE.md',
              '- the checked-in 0.1.8 update baseline remains fail-closed with `enabled:false`, empty SHA-256 and zero size until a real signed package exists.',
              '- Ghosium New Tab, Customize/Options and Ghosium Privacy use checked-in branded UI surfaces with generated extension icons;\n- README interface images are actual pinned-Chromium renders of those checked-in surfaces, with provenance, and are not represented as full-source native browser-shell screenshots;\n- source branding now applies and verifies the native public-surface and performance-default transforms as part of the normal fork pipeline;\n- canonical source packaging produces both `Ghosium-Browser-Setup.exe` and registry-free `Ghosium-Browser-Portable.exe` from the same verified source stage;\n- production publication requires exact Portable SHA-256/size provenance and Valid Authenticode for both Setup and Portable;\n- the checked-in 0.1.9 update baseline remains fail-closed with `enabled:false`, empty SHA-256 and zero size until a real signed Setup exists.',
          )
          replace_required(
              'docs/RELEASE.md',
              '20. canonical `Ghosium-Browser-Setup.exe` build;\n21. production Authenticode signing on `main`;\n22. install → runtime → update → runtime → uninstall round trip;\n23. profile/language preservation and cleanup verification;\n24. exact update-manifest generation;\n25. provenance and SHA-256 evidence;\n26. immutable release publication.',
              '20. canonical `Ghosium-Browser-Setup.exe` and `Ghosium-Browser-Portable.exe` build from the same verified source stage;\n21. Portable registry-free/profile-isolation provenance validation;\n22. production Authenticode signing of Setup and Portable on `main`;\n23. install → runtime → update → runtime → uninstall round trip for Setup;\n24. profile/language preservation and cleanup verification;\n25. exact update-manifest generation for the signed Setup;\n26. provenance and SHA-256 evidence for both public packages;\n27. immutable release publication.',
          )
          replace_required(
              'docs/RELEASE.md',
              'The stable end-user Windows artifact is:\n\n```text\nGhosium-Browser-Setup.exe\n```\n\nThe workflow may retain technical source-runtime archives and JSON evidence for diagnosis/provenance, but they are not alternative end-user browser packages.\n\nThe retired legacy Portable package is not part of the active release architecture. It must not return unless a future Portable design is generated from the same verified source output and receives equivalent runtime, profile-isolation, update and cleanup verification.',
              'The stable end-user Windows artifacts are:\n\n```text\nGhosium-Browser-Setup.exe\nGhosium-Browser-Portable.exe\n```\n\nSetup is the canonical install/update/uninstall maintenance package. Portable is generated from the same verified source stage, writes no install registration/shortcuts, and uses an adjacent isolated user-data directory. The workflow may retain technical source-runtime archives and JSON evidence for diagnosis/provenance, but they are not alternative end-user browser packages.\n\nThe retired legacy wrapper/snapshot Portable architecture remains forbidden; the current Portable design is part of the canonical source-stage packaging contract and must satisfy provenance, signing and profile-isolation gates.',
          )
          replace_required(
              'docs/RELEASE.md',
              'Ghosium-Browser-Setup.exe\nGHOSIUM-BUILDER-READY.json',
              'Ghosium-Browser-Setup.exe\nGhosium-Browser-Portable.exe\nGHOSIUM-BUILDER-READY.json',
          )
          replace_required(
              'docs/RELEASE.md',
              'The canonical Setup is the only public maintenance package and supports normal install, `/S /UPDATE` and `/S /UNINSTALL`.',
              'The canonical Setup is the only public maintenance package and supports normal install, `/S /UPDATE` and `/S /UNINSTALL`. Portable is a separate registry-free run-in-place package and is never used as the updater/uninstaller.',
          )
          replace_required(
              'docs/RELEASE.md',
              'Do not describe a release as Authenticode-signed unless the actual published Setup and required binaries are signed by the configured Brendigo/Ghosium identity and validation succeeds in the production workflow.',
              'Do not describe a release as Authenticode-signed unless the actual published Setup, Portable and required binaries are signed by the configured Brendigo/Ghosium identity and validation succeeds in the production workflow.',
          )
          replace_required('docs/RELEASE.md', 'Do not merge or publish 0.1.8 merely because hosted source contracts are green.', 'Do not merge or publish 0.1.9 merely because hosted source contracts are green.')

          # CHANGELOG: prepend the active release entry while preserving all historical entries verbatim.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 0.1.9 — Ghosium UI, real README imagery and canonical Portable\n\n### Product UI and branding\n- Added Ghosium-owned New Tab, Customize/Options and Ghosium Privacy surfaces with local accent, compact-layout, navigation/status and reduced-effects preferences.\n- Added generated Ghosium extension icons and branded NSIS header/welcome artwork while retaining existing installer security behavior.\n- Connected the native public-surface and performance-default rewrite/verification steps to the normal source-branding pipeline so those source changes are no longer dormant helpers.\n\n### README and evidence\n- Added the Ghosium browser mark to README and synchronized active documentation to 0.1.9.\n- Added actual pinned-Chromium renders of the checked-in Ghosium New Tab, Options and Privacy surfaces plus `GHOSIUM-SCREENSHOTS.json` provenance.\n- The screenshots are explicitly not presented as canonical full-source browser-shell evidence; that claim remains gated on the controlled Windows source build.\n\n### Setup and Portable\n- Added canonical `Ghosium-Browser-Portable.exe` generation from the same verified source stage as Setup, using an adjacent `Ghosium-Portable-Data` profile and no install registration or shortcuts.\n- Extended package provenance to schema v3 with Portable filename, byte size, SHA-256 and behavioral guarantees.\n- Production signing now requires Valid Authenticode for both Setup and Portable, with the same expected publisher relationship as the signed browser.\n- Full-source SHA-256 generation and immutable release publication now require and publish both public EXE packages.\n\n### Performance comparison\n- Added `BRZINA.md` and same-run Windows browser comparison tooling for Ghosium, Chrome, Edge, Firefox, Brave, Vivaldi and Opera. Numerical claims remain prohibited until the browsers are actually measured under the documented common methodology.\n\n> `0.1.9` is not a source-built production release until the controlled Windows candidate and production workflows compile, runtime-test, measure, sign and package the exact production commit.\n\n'''
          if '## 0.1.9 ' not in text:
              if not text.startswith('# Changelog\n\n'):
                  raise SystemExit('Unexpected CHANGELOG header')
              text = '# Changelog\n\n' + entry + text[len('# Changelog\n\n'):]
              changelog.write_text(text, encoding='utf-8', newline='\n')

          # Assert the exact strings required by Repository Hygiene Contract.
          required = {
              Path('BUILDING.md'): (
                  'The active product version is `0.1.9`',
                  'Ghosium 0.1.9 supports 38 locales',
                  'The 0.1.9 Windows source configuration includes',
                  'compiled source-built 0.1.9 binary',
              ),
              Path('docs/RELEASE.md'): (
                  'The active development version is `0.1.9`',
                  '## 0.1.9 release scope',
                  'Do not merge or publish 0.1.9 merely because hosted source contracts are green',
              ),
          }
          for path, needles in required.items():
              data = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f'Missing post-sync invariant in {path}: {needle}')
          first_release = next(line for line in changelog.read_text(encoding='utf-8').splitlines() if line.startswith('## '))
          if not first_release.startswith('## 0.1.9 '):
              raise SystemExit(f'CHANGELOG active entry mismatch: {first_release}')

      - name: Commit documentation synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILDING.md docs/RELEASE.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: synchronize Ghosium 0.1.9 release contract'
          git push origin HEAD:ghosium/release/0.1.9
