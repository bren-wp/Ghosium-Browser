name: Ghosium 0.0.2 Production Release Trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ghosium-0.0.2-release-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-release:
    name: Dispatch canonical full-source production release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run full-source-windows-build.yml --ref main --repo "$GITHUB_REPOSITORY"
