name: Ghosium 0.1.9 Packaging Migration

on:
  push:
    branches:
      - ghosium/release/0.1.9
    paths:
      - '.release/ghosium-v0.1.9.packaging'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ghosium/release/0.1.9
          fetch-depth: 1
      - name: Apply packaging migration
        run: python3 scripts/migrate-0.1.9-packaging.py
      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'Ghosium-Browser-Portable.exe' installer/ghosium-portable.nsi
          grep -F 'portablePackage' scripts/build-source-release-installer.ps1
          grep -F 'MUI_HEADERIMAGE_BITMAP' installer/ghosium.nsi
      - name: Commit packaging migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/ghosium.nsi scripts/build-source-release-installer.ps1
          if git diff --cached --quiet; then
            echo 'Packaging migration already applied.'
            exit 0
          fi
          git commit -m 'release: build Setup and Portable packages'
          git push origin HEAD:ghosium/release/0.1.9
