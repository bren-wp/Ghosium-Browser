name: Ghosium Search Shared Hosting Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'search-web/**'
      - '.github/workflows/search-web-contract.yml'
  push:
    branches: [main]
    paths:
      - 'search-web/**'
      - '.github/workflows/search-web-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-web:
    name: Verify production shared-hosting search
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify PHP runtime and syntax
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            if (PHP_VERSION_ID < 80100) {
              fwrite(STDERR, "PHP 8.1+ is required; found " . PHP_VERSION . PHP_EOL);
              exit(1);
            }
            echo "PHP " . PHP_VERSION . PHP_EOL;
          '
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find search-web -type f -name '*.php' -print0 | sort -z)

      - name: Run deterministic search contract
        shell: bash
        run: |
          set -euo pipefail
          php search-web/tests/contract.php

      - name: Verify shared-hosting architecture
        shell: bash
        run: |
          set -euo pipefail

          test -f search-web/.htaccess
          test -f search-web/storage/.htaccess
          test -f search-web/inc/.htaccess
          test -f search-web/cron/.htaccess
          test -f search-web/index.php
          test -f search-web/inc/ui.php
          test -f search-web/assets/app.css
          test -f search-web/cron/reindex.php
          test -f search-web/api/search.php
          test -f search-web/api/suggest.php
          test -f search-web/api/stats.php

          grep -Fq 'Options -Indexes' search-web/.htaccess
          grep -Fq 'Require all denied' search-web/storage/.htaccess
          grep -Fq "PHP_SAPI !== 'cli'" search-web/cron/reindex.php
          grep -Fq 'respect_robots' search-web/cron/reindex.php
          grep -Fq 'noindex' search-web/cron/reindex.php
          grep -Fq 'nofollow' search-web/cron/reindex.php
          grep -Fq 'LOCK_EX | LOCK_NB' search-web/cron/reindex.php
          grep -Fq 'Existing index was preserved' search-web/cron/reindex.php

          if find search-web -maxdepth 2 -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' -o -name 'pnpm-lock.yaml' -o -name 'composer.json' \) -print -quit | grep -q .; then
            echo 'Production Ghosium Search must not require Node/npm/Composer at request time.' >&2
            exit 1
          fi

          if find search-web/assets -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit | grep -q .; then
            echo 'Ghosium Search public UI must remain server-rendered with no JavaScript runtime bundle.' >&2
            exit 1
          fi

          if grep -RInE '\b(shell_exec|passthru|proc_open|popen|system)\s*\(' search-web --include='*.php'; then
            echo 'Ghosium Search production PHP must not execute shell commands from web requests.' >&2
            exit 1
          fi

          if find search-web -type f \( -name 'Cargo.toml' -o -name 'Cargo.lock' -o -name '*.rs' \) -print -quit | grep -q .; then
            echo 'Shared-hosting Ghosium Search must remain independent of unrelated Rust runtime dependencies.' >&2
            exit 1
          fi

      - name: Verify browser-aligned public UI
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Search without the noise.' search-web/index.php
          grep -Fq 'same visual language as Ghosium Browser' search-web/index.php
          grep -Fq 'No account required' search-web/index.php
          grep -Fq 'browser-bar' search-web/index.php
          grep -Fq 'search-box' search-web/inc/ui.php
          grep -Fq -- '--surface-0: #111016' search-web/assets/app.css
          grep -Fq -- '--mint: #8af0c7' search-web/assets/app.css
          grep -Fq -- '--teal: #62e7d5' search-web/assets/app.css
          grep -Fq -- '--cyan: #49d5f2' search-web/assets/app.css

          if grep -Eqi 'site:example\.com|!gh query|indexed pages|First-party index mode|Hybrid provider enabled' search-web/index.php; then
            echo 'Developer operators/index implementation details leaked into the public Search UI.' >&2
            exit 1
          fi
          if grep -Eqi '<script\b|\sstyle=' search-web/index.php search-web/inc/ui.php; then
            echo 'Ghosium Search public templates must not contain inline JavaScript or inline CSS.' >&2
            exit 1
          fi

      - name: Smoke-test HTTP and JSON surfaces
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8765 -t search-web >"${RUNNER_TEMP}/ghosium-search-php.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health.php >/dev/null; then
              break
            fi
            sleep 0.25
          done

          home="${RUNNER_TEMP}/home.html"
          curl --fail --silent http://127.0.0.1:8765/ >"$home"
          grep -Fq 'Search without the noise.' "$home"
          grep -Fq 'Search the web' "$home"
          if grep -Eqi 'site:example\.com|!gh query|indexed pages|First-party index mode|Hybrid provider enabled' "$home"; then
            echo 'Public Search response exposed developer/query-engine implementation details.' >&2
            exit 1
          fi

          curl --fail --silent --get \
            --data-urlencode 'q=site:store.ghosium.com' \
            http://127.0.0.1:8765/api/search.php >"${RUNNER_TEMP}/search.json"

          curl --fail --silent --get \
            --data-urlencode 'q=chromium !gh' \
            http://127.0.0.1:8765/api/search.php >"${RUNNER_TEMP}/bang.json"

          curl --fail --silent http://127.0.0.1:8765/api/stats.php >"${RUNNER_TEMP}/stats.json"

          python3 - "${RUNNER_TEMP}/search.json" "${RUNNER_TEMP}/bang.json" "${RUNNER_TEMP}/stats.json" <<'PY'
          import json
          import sys
          from urllib.parse import urlparse

          search = json.load(open(sys.argv[1], encoding='utf-8'))
          bang = json.load(open(sys.argv[2], encoding='utf-8'))
          stats = json.load(open(sys.argv[3], encoding='utf-8'))

          assert search['parsed']['site'] == 'store.ghosium.com'
          assert len(search['results']) == 1
          assert urlparse(search['results'][0]['url']).hostname == 'store.ghosium.com'

          assert bang['bang']['bang'] == 'gh'
          assert bang['bang']['query'] == 'chromium'
          assert bang['bang']['url'].startswith('https://github.com/search?')
          assert bang['results'] == []

          assert stats['status'] == 'ok'
          assert stats['index']['pages'] >= 3
          assert stats['index']['domains'] >= 3
          PY

      - name: Verify clean-room product boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f search-web/RESEARCH.md
          grep -Fq 'AGPL-3.0' search-web/RESEARCH.md
          grep -Fq 'clean-room' search-web/RESEARCH.md
          grep -Fq 'MPL-2.0' search-web/RESEARCH.md
          grep -Fq 'shared hosting' search-web/README.md
          grep -Fq 'site:' search-web/README.md
          grep -Fq '!bang' search-web/README.md
