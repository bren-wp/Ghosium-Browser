name: Ghosium Production Release Dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.release/ghosium-v0.1.5.production'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ghosium-production-release-dispatch
  cancel-in-progress: false

jobs:
  dispatch-production:
    name: Queue verified Ghosium 0.1.5 production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate production request
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$version" = '0.1.5'
          test -f '.release/ghosium-v0.1.5.production'
          grep -Fxq 'version=0.1.5' '.release/ghosium-v0.1.5.production'
          grep -Fxq 'candidate_commit=9e771a9880ef424e4de7efa068801684c784b64d' '.release/ghosium-v0.1.5.production'
          grep -Fxq 'candidate_tree=21a57ad1cd964c4247cabfcd93bf9313f7380ec4' '.release/ghosium-v0.1.5.production'
          echo 'Validated Ghosium 0.1.5 production request.'

      - name: Clear superseded release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34179694874 34182761239; do
            if ! gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"; then
              echo "Run $run_id could not be cancelled (it may already be completed); continuing."
            fi
          done

      - name: Ensure production full-source build is queued
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          production_run=34183762471
          state="$(gh run view "$production_run" --repo "$GITHUB_REPOSITORY" --json status --jq .status 2>/dev/null || true)"
          if [[ "$state" == 'pending' || "$state" == 'queued' || "$state" == 'in_progress' || "$state" == 'waiting' || "$state" == 'requested' ]]; then
            echo "Production run $production_run already exists with status $state; not dispatching a duplicate."
          else
            echo "Production run $production_run is not active (status: ${state:-unknown}); dispatching a replacement."
            gh workflow run full-source-windows-build.yml --ref main --repo "$GITHUB_REPOSITORY"
          fi
          sleep 5
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow full-source-windows-build.yml \
            --branch main \
            --limit 5
