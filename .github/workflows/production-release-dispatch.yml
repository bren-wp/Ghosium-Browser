name: Ghosium Production Release Dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.release/ghosium-v0.1.5.production'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ghosium-production-release-dispatch
  cancel-in-progress: false

jobs:
  dispatch-production:
    name: Queue verified Ghosium 0.1.5 production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate production request
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$version" = '0.1.5'
          test -f '.release/ghosium-v0.1.5.production'
          grep -Fxq 'version=0.1.5' '.release/ghosium-v0.1.5.production'
          grep -Fxq 'candidate_commit=9e771a9880ef424e4de7efa068801684c784b64d' '.release/ghosium-v0.1.5.production'
          grep -Fxq 'candidate_tree=21a57ad1cd964c4247cabfcd93bf9313f7380ec4' '.release/ghosium-v0.1.5.production'
          echo 'Validated Ghosium 0.1.5 production request.'

      - name: Cancel superseded candidate build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/34182761239/cancel"; then
            echo 'Candidate run could not be cancelled (it may already be completed); continuing with production dispatch.'
          fi

      - name: Dispatch production full-source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run full-source-windows-build.yml --ref main --repo "$GITHUB_REPOSITORY"
          sleep 5
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow full-source-windows-build.yml \
            --branch main \
            --limit 5
