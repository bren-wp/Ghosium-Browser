name: Ghosium Source Builder Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'DEPOT_TOOLS_REVISION'
      - 'scripts/verify-source-builder-host.ps1'
      - 'scripts/bootstrap-engine-source.ps1'
      - 'scripts/verify-engine-build-output.ps1'
      - 'scripts/benchmark-ghosium-windows.ps1'
      - 'scripts/verify-pinned-source-anchors.py'
      - 'scripts/smoke-test-source-windows-installer.ps1'
      - 'scripts/assemble-source-release-stage.ps1'
      - 'scripts/build-source-release-installer.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'docs/SOURCE_BUILDER_SETUP.md'
      - '.github/workflows/full-source-windows-build.yml'
      - '.github/workflows/source-builder-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'DEPOT_TOOLS_REVISION'
      - 'scripts/verify-source-builder-host.ps1'
      - 'scripts/bootstrap-engine-source.ps1'
      - 'scripts/verify-engine-build-output.ps1'
      - 'scripts/benchmark-ghosium-windows.ps1'
      - 'scripts/verify-pinned-source-anchors.py'
      - 'scripts/smoke-test-source-windows-installer.ps1'
      - 'scripts/assemble-source-release-stage.ps1'
      - 'scripts/build-source-release-installer.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'docs/SOURCE_BUILDER_SETUP.md'
      - '.github/workflows/full-source-windows-build.yml'
      - '.github/workflows/source-builder-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder-contract:
    name: Verify full-source builder readiness contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate pinned revision files
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(tr -d '\r\n ' < ENGINE_SOURCE_REVISION)"
          depot_revision="$(tr -d '\r\n ' < DEPOT_TOOLS_REVISION)"
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'ENGINE_SOURCE_REVISION must be one 40-character Git commit.' >&2; exit 1; }
          [[ "$depot_revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPOT_TOOLS_REVISION must be one 40-character Git commit.' >&2; exit 1; }

      - name: Verify depot_tools pin matches pinned Chromium DEPS
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(tr -d '\r\n ' < ENGINE_SOURCE_REVISION)"
          depot_revision="$(tr -d '\r\n ' < DEPOT_TOOLS_REVISION)"
          encoded="${RUNNER_TEMP}/chromium-DEPS.b64"
          deps="${RUNNER_TEMP}/chromium-DEPS"

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://chromium.googlesource.com/chromium/src/+/${source_revision}/DEPS?format=TEXT" \
            --output "$encoded"
          base64 --decode "$encoded" > "$deps"

          python3 - "$deps" "$depot_revision" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          expected = sys.argv[2]
          pattern = re.compile(
              r"'src/third_party/depot_tools'\s*:\s*"
              r"Var\('chromium_git'\)\s*\+\s*"
              r"'/chromium/tools/depot_tools\.git'\s*\+\s*"
              r"'@'\s*\+\s*'([0-9a-f]{40})'",
              re.MULTILINE,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Pinned Chromium DEPS depot_tools revision entry was not found.')
          actual = match.group(1)
          if actual != expected:
              raise SystemExit(
                  f'DEPOT_TOOLS_REVISION mismatch: Ghosium pins {expected}, '
                  f'but pinned Chromium DEPS requires {actual}.'
              )
          print(f'Pinned Chromium DEPS and Ghosium agree on depot_tools {actual}.')
          PY

      - name: Validate builder and release tooling syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/verify-source-builder-host.ps1',
            'scripts/bootstrap-engine-source.ps1',
            'scripts/verify-engine-build-output.ps1',
            'scripts/benchmark-ghosium-windows.ps1',
            'scripts/smoke-test-source-windows-installer.ps1',
            'scripts/assemble-source-release-stage.ps1',
            'scripts/build-source-release-installer.ps1',
            'scripts/smoke-test-windows-installer.ps1',
            'scripts/generate-update-manifest.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }
          python3 -m py_compile scripts/verify-pinned-source-anchors.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned-source anchor verifier has Python syntax errors.'
          }

      - name: Verify pinned Chromium host requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content 'scripts/verify-source-builder-host.ps1' -Raw
          foreach ($required in @(
            "Join-Path `$repoRoot 'DEPOT_TOOLS_REVISION'",
            'depot_tools revision mismatch',
            "`$requiredVisualStudioMajor = 18",
            "`$requiredWindowsSdk = '10.0.28000.2270'",
            '10.0.26100.3323',
            "`$minimumRamGiB = 8",
            "`$recommendedRamGiB = 32",
            "`$minimumFreshFreeGiB = 120",
            "`$minimumReuseFreeGiB = 60",
            'RuntimeInformation]::OSArchitecture',
            "'X64'",
            'Microsoft.VisualStudio.Workload.NativeDesktop',
            'Microsoft.VisualStudio.Component.VC.ATLMFC',
            "'NTFS'",
            "'core.autocrlf'",
            "'core.filemode'",
            "'core.fscache'",
            "'core.longpaths'",
            'DEPOT_TOOLS_WIN_TOOLCHAIN',
            'DEPOT_TOOLS_UPDATE',
            'GIT_TERMINAL_PROMPT',
            'chromium.googlesource.com/chromium/tools/depot_tools',
            "Require-Command -Name 'fetch'",
            "Require-Command -Name 'gclient'",
            "Require-Command -Name 'gn'",
            "Require-Command -Name 'autoninja'",
            "Require-Command -Name 'python3'",
            "`$WorkRoot = 'C:\src\ghosium-engine'",
            "Join-Path `$resolvedWorkRoot 'src\.git'",
            "Join-Path `$resolvedWorkRoot '.gclient'",
            "`$workspaceState = 'fresh-empty'",
            "`$workspaceState = 'reusable-complete'",
            'nonempty but incomplete'
          )) {
            if (!$script.Contains($required)) {
              throw "Builder preflight is missing required invariant: $required"
            }
          }
          if ($script -match '(?i)api[_-]?key|client_secret|private[_-]?key|github_token|personal access token') {
            throw 'Builder readiness script must not contain credentials or product API secrets.'
          }
          if ($script.Contains("Join-Path `$env:RUNNER_TEMP 'ghosium-engine'")) {
            throw 'Engine source workspace must not silently fall back to RUNNER_TEMP.'
          }

      - name: Verify absolute workspace bootstrap safety
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Get-Content 'scripts/bootstrap-engine-source.ps1' -Raw
          foreach ($required in @(
            '[IO.Path]::IsPathFullyQualified($Destination)',
            '[IO.Path]::GetFullPath($Destination)',
            "[IO.Path]::GetFullPath((Join-Path (Get-Location).Path `$Destination))",
            'git -C $src clean -ffd'
          )) {
            if (!$bootstrap.Contains($required)) {
              throw "Chromium bootstrap is missing absolute/relative workspace guard: $required"
            }
          }
          if ($bootstrap.Contains("[IO.Path]::GetFullPath((Join-Path (Get-Location) `$Destination))")) {
            throw 'Chromium bootstrap must not append a fully-qualified Windows destination to the current repository path.'
          }

          $syncMatch = [regex]::Match($bootstrap, '(?s)\$syncArguments\s*=\s*@\((?<body>.*?)\)')
          if (!$syncMatch.Success) {
            throw 'Chromium bootstrap must define an explicit gclient sync argument list.'
          }
          $syncBody = $syncMatch.Groups['body'].Value
          foreach ($requiredSyncArgument in @(
            "'sync'",
            "'--reset'",
            "'--delete_unversioned_trees'",
            "'--force'",
            "'--with_branch_heads'",
            "'--with_tags'",
            "'--revision'",
            'src@$sourceRevision'
          )) {
            if (!$syncBody.Contains($requiredSyncArgument)) {
              throw "Persistent Chromium gclient sync is missing cleanup/pin invariant: $requiredSyncArgument"
            }
          }

      - name: Verify full-source runtime gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verifier = Get-Content 'scripts/verify-engine-build-output.ps1' -Raw
          foreach ($required in @(
            '[switch]$RunRuntimeSmoke',
            "'--headless=new'",
            "'--dump-dom'",
            'ghosium-source-runtime-ok',
            'sandboxDisabled = $false',
            'runtimeSmokePassed',
            'WaitForExit($runtimeSmokeTimeoutSeconds * 1000)',
            'Stop-Process -Id $process.Id -Force'
          )) {
            if (!$verifier.Contains($required)) {
              throw "Source-built binary verifier is missing runtime gate: $required"
            }
          }
          if ($verifier -match "(?i)'--no-sandbox'") {
            throw 'Source-built runtime smoke must not disable the Chromium sandbox.'
          }

          $technicalSmoke = Get-Content 'scripts/smoke-test-source-windows-installer.ps1' -Raw
          foreach ($required in @(
            "'Ghosium Browser'",
            "'--uninstall'",
            "'--force-uninstall'",
            "'--delete-profile'",
            "'--headless=new'",
            "'--dump-dom'",
            'ghosium-source-installed-runtime-ok',
            'UninstallString',
            'miniInstallerSha256',
            'applicationDirectoryRemoved',
            'registrationRemoved'
          )) {
            if (!$technicalSmoke.Contains($required)) {
              throw "Technical source mini-installer smoke is missing invariant: $required"
            }
          }
          if ($technicalSmoke -match "(?i)'--no-sandbox'") {
            throw 'Installed source-built runtime smoke must not disable the Chromium sandbox.'
          }

      - name: Verify benchmark telemetry contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $benchmark = Get-Content 'scripts/benchmark-ghosium-windows.ps1' -Raw
          foreach ($required in @(
            "[ValidateSet('PortableProfile', 'UserDataDir')]",
            "[string]`$ProfileMode = 'PortableProfile'",
            "Get-Counter -ListSet 'GPU Process Memory'",
            'Get-NetTCPConnection',
            'Get-NetUDPEndpoint',
            'uniqueRemoteAddressCount',
            'longIdleActivity',
            'schemaVersion = 2',
            '--user-data-dir='
          )) {
            if (!$benchmark.Contains($required)) {
              throw "Ghosium benchmark is missing required telemetry/profile invariant: $required"
            }
          }
          if ($benchmark -match "(?i)'--no-sandbox'|--disable-gpu-sandbox|--ignore-certificate-errors") {
            throw 'Benchmark tooling must not weaken runtime security to obtain measurements.'
          }

      - name: Verify canonical source-release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Get-Content 'scripts/assemble-source-release-stage.ps1' -Raw
          foreach ($required in @(
            "Join-Path `$outPath 'chrome.7z'",
            "Join-Path `$outPath 'Ghosium-Browser.exe'",
            'archiveBrowserHash',
            'compiledBrowserHash',
            "Copy-Item (Join-Path `$repoRoot 'LICENSE')",
            "Copy-Item (Join-Path `$repoRoot 'THIRD_PARTY_NOTICES.md')"
          )) {
            if (!$stage.Contains($required)) {
              throw "Canonical source-stage builder is missing invariant: $required"
            }
          }

          $package = Get-Content 'scripts/build-source-release-installer.ps1' -Raw
          foreach ($required in @(
            '[switch]$RequireSigning',
            'GHOSIUM_SIGN_CERT_THUMBPRINT',
            'GHOSIUM_TIMESTAMP_URL',
            'Ghosium-Browser-Setup.exe',
            'Public Ghosium Setup is still only a renamed Chromium mini_installer.exe.',
            'publicSetupIsChromiumMiniInstallerRename = $false',
            'sameSetupExecutable = $true'
          )) {
            if (!$package.Contains($required)) {
              throw "Canonical source-release packager is missing invariant: $required"
            }
          }

          $smoke = Get-Content 'scripts/smoke-test-windows-installer.ps1' -Raw
          foreach ($required in @(
            "@('/S', '/UPDATE', '/DELETESELF')",
            'profileSentinel',
            'Invoke-InstalledRuntimeSmoke',
            "@('/S', '/UNINSTALL')",
            'normalUninstallPreservedProfile'
          )) {
            if (!$smoke.Contains($required)) {
              throw "Canonical same-Setup smoke is missing invariant: $required"
            }
          }

      - name: Verify full-source workflow remains manual self-hosted and canonical
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content '.github/workflows/full-source-windows-build.yml' -Raw
          foreach ($required in @(
            'workflow_dispatch:',
            'self-hosted',
            'Windows',
            'X64',
            'ghosium-source-builder',
            "DEPOT_TOOLS_WIN_TOOLCHAIN: '0'",
            "DEPOT_TOOLS_UPDATE: '0'",
            "GIT_TERMINAL_PROMPT: '0'",
            'actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09',
            'persist-credentials: false',
            'verify-source-builder-host.ps1',
            'GHOSIUM-BUILDER-READY.json',
            'verify-pinned-source-anchors.py',
            'bootstrap-engine-source.ps1',
            'apply-engine-branding.ps1',
            'configure-engine-build.ps1',
            'autoninja -C out/Ghosium chrome mini_installer',
            'verify-engine-build-output.ps1',
            '-RunRuntimeSmoke',
            'benchmark-ghosium-windows.ps1',
            '-ProfileMode UserDataDir',
            'GHOSIUM-PERFORMANCE.json',
            'GHOSIUM-SOURCE-BUILD.json',
            'GHOSIUM-UPSTREAM-MINI-INSTALLER-SMOKE.json',
            'build-source-release-installer.ps1',
            'GHOSIUM-PUBLIC-SETUP.json',
            'GHOSIUM-CANONICAL-SETUP-SMOKE.json',
            'GHOSIUM-UPDATE-MANIFEST.json',
            '-RequireAuthenticode',
            'Generate verified full-source SHA-256 manifest',
            'SHA256SUMS.txt',
            'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          )) {
            if (!$workflow.Contains($required)) {
              throw "Full-source workflow is missing builder/release invariant: $required"
            }
          }
          if ($workflow -match '(?m)^\s*pull_request\s*:') {
            throw 'The heavyweight Chromium source build must not run automatically on pull requests.'
          }
          if ($workflow -match '(?m)^\s*push\s*:') {
            throw 'The heavyweight Chromium source build must remain an explicit manual workflow.'
          }
          if ($workflow -match '(?im)^\s*uses:\s*actions/(?:checkout|upload-artifact)@v\d+') {
            throw 'Security-sensitive actions in the self-hosted full-source workflow must use immutable commit SHAs.'
          }
          $forbiddenCopy = "Copy-Item (Join-Path `$out 'mini_installer.exe') 'artifacts/full-source/Ghosium-Browser-Setup.exe'"
          if ($workflow.Contains($forbiddenCopy)) {
            throw 'Public Ghosium Setup must not be produced by renaming Chromium mini_installer.exe.'
          }

      - name: Verify builder setup documentation
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/SOURCE_BUILDER_SETUP.md'
          grep -Fq 'ghosium-source-builder' "$doc"
          grep -Fq 'Visual Studio 2026' "$doc"
          grep -Fq '10.0.28000.2270' "$doc"
          grep -Fq '10.0.26100.3323' "$doc"
          grep -Fq 'DEPOT_TOOLS_REVISION' "$doc"
          grep -Fq 'DEPOT_TOOLS_WIN_TOOLCHAIN' "$doc"
          grep -Fq 'DEPOT_TOOLS_UPDATE' "$doc"
          grep -Fq 'GIT_TERMINAL_PROMPT' "$doc"
          grep -Fq 'GHOSIUM_SOURCE_WORK' "$doc"
          grep -Fq 'C:\src\ghosium-engine' "$doc"
          grep -Fq 'verify-source-builder-host.ps1' "$doc"
          grep -Fq 'autoninja -C out/Ghosium chrome mini_installer' "$doc"
          grep -Fq 'runtime smoke' "$doc"
          grep -Fq 'source-built installer' "$doc"
          grep -Fq 'GHOSIUM-PERFORMANCE.json' "$doc"
          grep -Fq 'interactive Windows desktop session' "$doc"
          grep -Fq 'Do not commit runner tokens' "$doc"
