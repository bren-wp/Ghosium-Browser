name: Ghosium Public Branding Regression Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'engine/branding/**'
      - 'scripts/rewrite-engine-public-branding-complete.ps1'
      - 'scripts/verify-engine-public-branding-complete.ps1'
      - '.github/workflows/public-branding-regression-contract.yml'
  push:
    branches: [main]
    paths:
      - 'ENGINE_SOURCE_REVISION'
      - 'engine/branding/**'
      - 'scripts/rewrite-engine-public-branding-complete.ps1'
      - 'scripts/verify-engine-public-branding-complete.ps1'
      - '.github/workflows/public-branding-regression-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grit-metadata-and-proper-names:
    name: Preserve GRIT metadata and non-browser product names
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Ghosium tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate branding tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/rewrite-engine-public-branding-complete.ps1',
            'scripts/verify-engine-public-branding-complete.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }

      - name: Sparse checkout pinned printing GRIT fixture
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/ghosium-public-branding-regression"
          revision="$(tr -d '\r\n ' < ENGINE_SOURCE_REVISION)"

          git init "$src"
          git -C "$src" remote add origin https://github.com/chromium/chromium.git
          git -C "$src" config core.sparseCheckout true
          mkdir -p "$src/.git/info"
          cat > "$src/.git/info/sparse-checkout" <<'EOF'
          /chrome/app/printing_strings.grdp
          EOF

          git -C "$src" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$revision"
          echo "GHOSIUM_REGRESSION_SRC=$src" >> "$GITHUB_ENV"

      - name: Prove pinned regression anchors
        shell: bash
        run: |
          set -euo pipefail
          strings="$GHOSIUM_REGRESSION_SRC/chrome/app/printing_strings.grdp"
          grep -F 'Chromebook' "$strings" >/dev/null
          grep -F '<ex>A Chrome app</ex>' "$strings" >/dev/null

      - name: Rewrite visible branding twice and prove idempotency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = $env:GHOSIUM_REGRESSION_SRC
          $strings = Join-Path $src 'chrome/app/printing_strings.grdp'

          ./scripts/rewrite-engine-public-branding-complete.ps1 -SourceRoot $src
          $firstDiff = (& git -C $src diff --binary) -join "`n"
          ./scripts/rewrite-engine-public-branding-complete.ps1 -SourceRoot $src
          $secondDiff = (& git -C $src diff --binary) -join "`n"
          if ($firstDiff -ne $secondDiff) {
            throw 'Complete public-branding rewrite is not idempotent on the GRIT regression fixture.'
          }

          $after = [IO.File]::ReadAllText($strings)
          if (!$after.Contains('Chromebook')) {
            throw 'Legitimate Chromebook product name was modified by Ghosium branding.'
          }
          if ($after.Contains('Ghosium Browserbook')) {
            throw 'Invalid Ghosium Browserbook token was created by stem branding.'
          }
          if (!$after.Contains('<ex>A Chrome app</ex>')) {
            throw 'Translator example metadata was modified by Ghosium branding.'
          }

      - name: Verify no public browser-brand leak remains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-engine-public-branding-complete.ps1 -SourceRoot $env:GHOSIUM_REGRESSION_SRC
          git -C $env:GHOSIUM_REGRESSION_SRC diff --check
          $thirdParty = @(& git -C $env:GHOSIUM_REGRESSION_SRC status --porcelain=v1 -- third_party)
          if ($thirdParty.Count -gt 0) {
            throw 'Public-branding regression contract modified third_party source.'
          }
