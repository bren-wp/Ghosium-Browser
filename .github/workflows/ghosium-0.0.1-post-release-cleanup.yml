name: Ghosium 0.0.1 Post-Release Cleanup

on:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Ghosium Full-Source Windows Build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ghosium-0.0.1-post-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Verify 0.0.1 release clean legacy releases and finalize docs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.tag_name == 'ghosium-v0.0.1') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ghosium-v0.0.1
      RELEASE_BRANCH: ghosium/release/0.0.1
      FALLBACK_BRANCH: fix/0.0.1-bootstrap-resilience
      PRODUCTION_RUNNER_ISSUE: '67'

    steps:
      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Require verified canonical 0.0.1 release assets
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == 'false' ]] || { echo '0.0.1 release is still a draft.' >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == 'false' ]] || { echo '0.0.1 release is still a prerelease.' >&2; exit 1; }

          for asset in \
            Ghosium-Browser-Setup.exe \
            Ghosium-Browser-Portable.exe \
            GHOSIUM-SOURCE-BUILD.json \
            GHOSIUM-PERFORMANCE.json \
            GHOSIUM-BUILDER-READY.json \
            GHOSIUM-PUBLIC-SETUP.json \
            GHOSIUM-CANONICAL-SETUP-SMOKE.json \
            GHOSIUM-UPDATE-MANIFEST.json \
            SHA256SUMS.txt; do
            count="$(jq --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            [[ "$count" == '1' ]] || { echo "Release asset $asset is missing or duplicated." >&2; exit 1; }
          done

          published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
          [[ -n "$published_at" ]] || { echo '0.0.1 release has no publication timestamp.' >&2; exit 1; }
          echo "GHOSIUM_RELEASE_DATE=${published_at%%T*}" >> "$GITHUB_ENV"

      - name: Remove every superseded GitHub release and Ghosium version tag
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --method GET --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name'
          )
          for tag in "${releases[@]}"; do
            [[ -n "$tag" ]] || continue
            if [[ "$tag" != "$RELEASE_TAG" ]]; then
              echo "Removing superseded release: $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done

          mapfile -t version_tags < <(
            gh api --method GET --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/ghosium-v" --jq '.[].ref'
          )
          for ref in "${version_tags[@]}"; do
            [[ -n "$ref" ]] || continue
            tag="${ref#refs/tags/}"
            if [[ "$tag" != "$RELEASE_TAG" ]]; then
              echo "Removing superseded Ghosium version tag: $tag"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done

          release_tags="$(gh api --method GET --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          [[ "$(printf '%s\n' "$release_tags" | sed '/^$/d' | wc -l | tr -d ' ')" == '1' ]] || {
            echo 'Expected exactly one GitHub Release after cleanup.' >&2
            printf '%s\n' "$release_tags" >&2
            exit 1
          }
          [[ "$(printf '%s\n' "$release_tags" | sed '/^$/d')" == "$RELEASE_TAG" ]] || {
            echo 'The remaining GitHub Release is not 0.0.1.' >&2
            exit 1
          }

          remaining_version_tags="$(gh api --method GET --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/ghosium-v" --jq '.[].ref' | sed 's#^refs/tags/##')"
          [[ "$(printf '%s\n' "$remaining_version_tags" | sed '/^$/d' | wc -l | tr -d ' ')" == '1' ]] || {
            echo 'Expected exactly one ghosium-v* version tag after cleanup.' >&2
            printf '%s\n' "$remaining_version_tags" >&2
            exit 1
          }
          [[ "$(printf '%s\n' "$remaining_version_tags" | sed '/^$/d')" == "$RELEASE_TAG" ]] || {
            echo 'The remaining Ghosium version tag is not 0.0.1.' >&2
            exit 1
          }

      - name: Finalize active 0.0.1 documentation
        shell: python
        run: |
          import os
          from pathlib import Path

          release_date = os.environ['GHOSIUM_RELEASE_DATE']

          def replace_or_verify(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new)
              if new in text:
                  return text
              raise SystemExit(f'{label} baseline changed unexpectedly.')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_or_verify(
              text,
              '**Ghosium Browser by Brendigo** is a Windows x64 browser. The current development version is **0.0.1**.',
              '**Ghosium Browser by Brendigo** is a Windows x64 browser. The current released version is **0.0.1**.',
              'README product status',
          )
          text = replace_or_verify(
              text,
              'No numerical 0.0.1 performance claim is valid until the compiled source-built 0.0.1 binary produces `GHOSIUM-PERFORMANCE.json` under the controlled benchmark workflow.',
              'Performance claims for 0.0.1 must be sourced from the verified `GHOSIUM-PERFORMANCE.json` evidence attached to the canonical release.',
              'README performance status',
          )
          old_status = '''## Release status\n\n**0.0.1 must not be described as a released source-built binary until the exact 0.0.1 candidate and production workflows compile, runtime-test, benchmark, package and satisfy required production signing/provenance gates.**\n\nThe checked-in update manifest remains fail-closed (`enabled:false`, empty SHA-256, zero size) until generated from a real verified production package.'''
          new_status = f'''## Release status\n\n**0.0.1 is the current released Ghosium Browser version, published on {release_date}.** The canonical release contains verified Windows Setup and Portable packages plus source-build, runtime, performance, installer, update-manifest and SHA-256 provenance evidence.\n\nThe checked-in update baseline remains fail-closed; the production release carries the generated update-manifest evidence bound to the verified signed package.'''
          text = replace_or_verify(text, old_status, new_status, 'README release status')
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          text = replace_or_verify(
              text,
              '## 0.0.1 — clean Ghosium Browser baseline',
              f'## 0.0.1 — released {release_date}',
              'CHANGELOG heading',
          )
          text = replace_or_verify(
              text,
              '> 0.0.1 is published only after the exact candidate and production release gates succeed. Static source checks alone are not release evidence.',
              '> Released after the exact candidate and production full-source gates completed, with canonical Setup/Portable packages and attached verification evidence.',
              'CHANGELOG release evidence',
          )
          changelog.write_text(text, encoding='utf-8')

          release_doc = Path('docs/RELEASE.md')
          text = release_doc.read_text(encoding='utf-8')
          text = replace_or_verify(
              text,
              'The active development version is `0.0.1`.',
              f'The current released version is `0.0.1` (published {release_date}).',
              'Release document status',
          )
          text = replace_or_verify(
              text,
              'The checked-in update baseline remains disabled until a real verified production package exists.',
              'The checked-in update baseline remains disabled by design; the released production package carries separately generated signed update-manifest evidence.',
              'Release document update status',
          )
          decision = '## Release decision\n\nDo not merge or publish 0.0.1 merely because hosted source contracts are green. A source audit, documentation cleanup or patch-only result is not a production browser release. Publication requires the exact 0.0.1 full-source candidate and production gates to succeed.'
          completed = f'## Release decision\n\n0.0.1 completed the canonical release path and was published on {release_date}. Future publication decisions must continue to require exact full-source candidate and production evidence; source audits, documentation-only changes and patch-only checks are not substitutes for production release evidence.'
          text = replace_or_verify(text, decision, completed, 'Release decision')
          release_doc.write_text(text, encoding='utf-8')

          building = Path('BUILDING.md')
          text = building.read_text(encoding='utf-8')
          text = replace_or_verify(
              text,
              'Do not publish performance claims until the compiled source-built 0.0.1 binary has produced verified `GHOSIUM-PERFORMANCE.json` evidence.',
              'Performance claims for 0.0.1 must remain tied to the verified `GHOSIUM-PERFORMANCE.json` evidence from the canonical release build.',
              'BUILDING performance status',
          )
          building.write_text(text, encoding='utf-8')

          engine = Path('engine/README.md')
          text = engine.read_text(encoding='utf-8')
          text = replace_or_verify(
              text,
              'The canonical build flow is documented in `../BUILDING.md`. A source transform is not a release: 0.0.1 requires exact-SHA compile, runtime, benchmark, package, provenance and production-signing evidence before publication.',
              'The canonical build flow is documented in `../BUILDING.md`. The released 0.0.1 package is backed by exact-SHA compile, runtime, benchmark, package, provenance and production-signing evidence.',
              'Engine release status',
          )
          engine.write_text(text, encoding='utf-8')

      - name: Verify active documentation contains only the 0.0.1 product line
        shell: python
        run: |
          import re
          from pathlib import Path

          docs = [
              Path('README.md'), Path('CHANGELOG.md'), Path('docs/RELEASE.md'),
              Path('BUILDING.md'), Path('engine/README.md'),
          ]
          for path in docs:
              text = path.read_text(encoding='utf-8')
              versions = set(re.findall(r'\b0\.\d+\.\d+\b', text))
              if versions - {'0.0.1'}:
                  raise SystemExit(f'{path} contains superseded active product versions: {sorted(versions)}')
              if '0.0.1' not in versions:
                  raise SystemExit(f'{path} lost the current 0.0.1 product version.')

      - name: Remove one-time release state and commit final release repository
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .release/ghosium-v0.0.1.request \
            .github/workflows/ghosium-0.0.1-candidate-retry-dispatch.yml \
            .github/workflows/ghosium-0.0.1-release-bridge.yml \
            .github/workflows/ghosium-0.0.1-post-release-cleanup.yml

          if git diff --quiet --cached && git diff --quiet -- README.md CHANGELOG.md docs/RELEASE.md BUILDING.md engine/README.md; then
            echo 'Final 0.0.1 repository state is already clean.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md CHANGELOG.md docs/RELEASE.md BUILDING.md engine/README.md
            git commit -m "docs: finalize Ghosium 0.0.1 release"
            git push origin HEAD:main
          fi

      - name: Remove one-time release and fallback branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in "$RELEASE_BRANCH" "$FALLBACK_BRANCH"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "One-time branch ${branch} still exists." >&2
              exit 1
            fi
          done

      - name: Close temporary production-runner blocker
        shell: bash
        run: |
          set -euo pipefail
          if gh issue view "$PRODUCTION_RUNNER_ISSUE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            state="$(gh issue view "$PRODUCTION_RUNNER_ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
            if [[ "$state" == 'OPEN' ]]; then
              gh issue close "$PRODUCTION_RUNNER_ISSUE" --repo "$GITHUB_REPOSITORY" --comment "Canonical Ghosium Browser 0.0.1 has been published with verified production assets. Closing the one-time production runner blocker."
            fi
          fi
