name: Cancel stale Ghosium 0.0.2 production run

on:
  push:
    branches:
      - ops/cancel-obsolete-release-runs
    paths:
      - '.ops/cancel-stale-ghosium-0.0.2.request'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-production:
    name: Cancel stale production run 34633964547
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale production run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 34633964547 --repo "$GITHUB_REPOSITORY"
