<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Ghosium</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="mark" aria-hidden="true">G</div>
      <p class="eyebrow">GHOSIUM BROWSER</p>
      <h1 id="title">Private by default.<br>Fast by design.</h1>
      <p class="copy">Search the web without adding Ghosium analytics or telemetry.</p>
      <form action="https://www.google.com/search" method="get" role="search">
        <label class="sr-only" for="q">Search Google</label>
        <input id="q" name="q" type="search" inputmode="search" autocomplete="off" placeholder="Search Google" autofocus>
        <button type="submit">Search</button>
      </form>
      <nav aria-label="Ghosium links">
        <a href="https://ghosium.com/">Home</a>
        <a href="https://store.ghosium.com/">Store</a>
        <a href="https://ghosium.com/security">Security</a>
        <a href="https://ghosium.com/support">Support</a>
      </nav>
    </section>
  </main>
</body>
</html>
